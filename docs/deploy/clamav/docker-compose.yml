# ClamAV for the antivirus scans (SRS 4.25, AV-1). Run on every server that hosts app volumes.
# The agent runs `docker exec clamav clamdscan …` against the volume's own path, so the Docker
# volumes are mounted read-only at the same path inside the container. freshclam in the image
# keeps the signatures current (several times a day).
services:
  clamav:
    image: clamav/clamav:1.5.4
    container_name: clamav            # the agent's clamav_container (default "clamav")
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav-db:/var/lib/clamav
      # The panel's YARA rules for PHP web shells and mailers; ClamAV loads .yar files from its database dir.
      - ./dmp-webshells.yar:/var/lib/clamav/dmp-webshells.yar:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    # clamd needs about 1.5 GB of memory for the signature database.
    mem_limit: 2g
volumes:
  clamav-db:
