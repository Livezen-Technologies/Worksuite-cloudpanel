# Fluent Bit on each managed server: Docker container logs + Traefik access log -> Loki.
# Set SERVER_ID to the panel's server id (same label as Prometheus targets).
[SERVICE]
    Flush        5
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /var/lib/docker/containers/*/*-json.log
    Parser       docker
    Tag          docker.*
    Refresh_Interval 10
    Mem_Buf_Limit 50MB

[INPUT]
    Name         tail
    Path         /var/log/traefik/access.log
    Parser       json
    Tag          traefik.access

[FILTER]
    Name         record_modifier
    Match        *
    Record       server_id ${SERVER_ID}

[OUTPUT]
    Name         loki
    Match        *
    Host         ${LOKI_HOST}
    Port         3100
    Labels       job=fluentbit, server_id=${SERVER_ID}
    Label_Keys   $container_name
    Line_Format  json
