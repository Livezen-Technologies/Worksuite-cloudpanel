# Docker Manager Portal: nginx in front of the Laravel API, the web app and the terminal relay,
# terminating agent mTLS (SRS SEC-003). Pair with AGENT_MTLS=required (or header) in api/.env.
#
#   ca.crt: the agent CA, from `curl https://panel.example.com/agent/v1/ca.crt`
#           (or api/storage/app/private/ca/ca.crt). Reload nginx if the CA is regenerated.
#
# Agents connect to agents.panel.example.com (a separate name so browsers are never asked for a
# client certificate); users use panel.example.com.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream dmp_api   { server 127.0.0.1:8000; }   # php-fpm/octane/artisan serve
upstream dmp_relay { server 127.0.0.1:8090; }   # dockermgr-relay (RELAY_LISTEN)

# --- Agent endpoint: client certificate required -------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name agents.panel.example.com;

    ssl_certificate         /etc/letsencrypt/live/agents.panel.example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/agents.panel.example.com/privkey.pem;
    ssl_client_certificate  /etc/dockermgr/agent-ca.crt;
    ssl_verify_client       on;          # "optional" + AGENT_MTLS=header during a migration
    ssl_verify_depth        1;
    ssl_protocols           TLSv1.2 TLSv1.3;

    # Never trust these headers from the client: always overwrite them.
    proxy_set_header X-SSL-Client-Verify        $ssl_client_verify;
    proxy_set_header X-Client-Cert              $ssl_client_escaped_cert;   # URL-encoded PEM; the API derives SHA-256
    proxy_set_header X-Client-Cert-Fingerprint  "";                         # ($ssl_client_fingerprint is SHA-1; X-Client-Cert is preferred)
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;

    location /agent/v1/ { proxy_pass http://dmp_api; }

    # Agent control connection and terminal dial-back (WebSocket). The relay forwards the
    # client-cert headers to /internal/relay/agents/verify, so AGENT_MTLS applies here too.
    location /relay/agent {
        proxy_pass http://dmp_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}

# --- User-facing panel ------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name panel.example.com;
    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    # Strip any client-supplied mTLS headers on the public name.
    proxy_set_header X-SSL-Client-Verify       "";
    proxy_set_header X-Client-Cert             "";
    proxy_set_header X-Client-Cert-Fingerprint "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    root /srv/dockermgr/web/dist;          # `npm run build` output
    location / { try_files $uri /index.html; }
    location /api/ { proxy_pass http://dmp_api; }

    # Browser terminal sessions: wss://panel.example.com/relay/terminal/{session}?token=…
    location /relay/terminal/ {
        proxy_pass http://dmp_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    # Agents must use agents.panel.example.com; /internal is never exposed.
    location /relay/agent { return 403; }
    location /internal/   { return 404; }
    location /agent/v1/install.sh { proxy_pass http://dmp_api; }
    location /agent/v1/download/  { proxy_pass http://dmp_api; }
    location /agent/v1/ca.crt     { proxy_pass http://dmp_api; }
}
