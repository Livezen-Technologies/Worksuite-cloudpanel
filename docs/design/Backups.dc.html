<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backups — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1000px; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 260px; max-width: 272px"><dc-import name="Sidebar" active="10" dark="{{dark}}" accent="{{accent}}" hint-size="272px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; max-width: 1168px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Backups</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">Encrypted, integrity-checked and restore-tested</p>
      </div>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 600 14px Inter">Restore…</button>
      <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 14px Inter">New backup policy</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <div style="padding: 18px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}"><div style="font-size: 13px; color: {{c.muted}}">{{t.k}}</div><div style="font-size: 24px; font-weight: 700; margin-top: 6px">{{t.v}}</div><div style="font-size: 12px; color: {{c.muted}}; margin-top: 2px">{{t.s}}</div></div>
      </sc-for>
    </div>
    <section style="padding: 20px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Last 14 days</h2>
      <div style="display: flex; gap: 6px; margin-top: 14px; align-items: flex-end; height: 64px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="14"><span title="{{d.label}}" style="{{d.style}}"></span></sc-for>
      </div>
      <div style="display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: {{c.muted}}"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{accent}}"></span>all succeeded</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #DC2626"></span>one or more failed</span></div>
    </section>
    <section style="border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; overflow: hidden">
      <h2 style="margin: 0; padding: 18px 20px 10px; font-size: 15px; font-weight: 600">Policies</h2>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px">
          <thead><tr style="text-align: left; color: {{c.muted}}; font-size: 12px; background: {{c.head}}"><sc-for list="{{cols}}" as="h" hint-placeholder-count="7"><th style="padding: 10px 16px; font-weight: 600">{{h}}</th></sc-for></tr></thead>
          <tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><tr style="border-top: 1px solid {{c.line}}"><sc-for list="{{r.cells}}" as="x" hint-placeholder-count="7"><td style="padding: 12px 16px"><span style="{{x.s}}">{{x.t}}</span></td></sc-for></tr></sc-for></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const c = dark
      ? { bg:'#0B1120', card:'#111827', head:'#0F172A', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B' }
      : { bg:'#F8FAFC', card:'#FFFFFF', head:'#F8FAFC', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0' };
    const tones = dark
      ? { g:['#052E1B','#4ADE80'], r:['#3B0D0D','#F87171'], n:['#1E293B','#CBD5E1'], b:['#0C2340','#60A5FA'] }
      : { g:['#ECFDF3','#15803D'], r:['#FEF2F2','#B91C1C'], n:['#F1F5F9','#475569'], b:['#EFF6FF','#1D4ED8'] };
    const B = t => `display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:${tones[t][0]};color:${tones[t][1]}`;
    const T = (t, s) => ({ t, s: s || `color:${c.muted};white-space:nowrap` });
    const S = t => T(t, `font-weight:600;color:${c.text};white-space:nowrap`);
    const data = [
      ['postgres-main','pg_dump','Daily 02:00','Cloudflare R2','success','g','verified','g','6 h ago'],
      ['minio-data','Restic snapshot','Every 6 h','Backblaze B2','success','g','verified','g','1 h ago'],
      ['wordpress volume','Restic snapshot','Daily 03:00','S3 (eu)','failed','r','—','n','5 h ago'],
      ['compose definitions','Git revision','On change','Gitea','success','g','verified','g','12 min ago'],
      ['server config','Encrypted archive','Weekly · Sun','Local + R2','success','g','restore-tested','b','2 d ago'],
    ];
    const hist = [9,9,9,8,9,9,9,9,7,9,9,9,9,8];
    const fails = [false,false,false,true,false,false,false,false,true,false,false,false,false,true];
    return { c, dark, accent,
      tiles: [{k:'Protected targets',v:'23',s:'across 6 servers'},{k:'Success rate (30 d)',v:'98.6%',s:'3 failed runs'},{k:'Stored',v:'4.4 TB',s:'encrypted at rest'},{k:'Last restore test',v:'4 days ago',s:'postgres-main · passed'}],
      days: hist.map((v, i) => ({ label: fails[i] ? 'failure' : 'all succeeded', style:`flex:1;height:${v*7}px;border-radius:4px;background:${fails[i]?'#DC2626':accent}` })),
      cols: ['Target','Method','Schedule','Destination','Last run','Integrity','When'],
      rows: data.map(d => ({ cells: [S(d[0]), T(d[1]), T(d[2]), T(d[3]), T(d[4], B(d[5])), T(d[6], B(d[7])), T(d[8])] })) };
  }
}
</script>
</body>
</html>
