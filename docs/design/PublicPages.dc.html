<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public pages — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8;text-decoration:none}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1054px; display: flex; flex-wrap: wrap; align-content: flex-start">
  <div style="flex: 1 1 100%"><dc-import name="TopBar" hint-size="100%,56px"></dc-import></div>
  <div style="flex: 0 0 336px"><dc-import name="Sidebar" active="PublicPages" dark="{{dark}}" accent="{{accent}}" hint-size="336px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Public pages</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: {{c.sub}}">What visitors see when a site is down, missing, suspended, protected or not set up yet</p>
      </div>
      <select aria-label="Scope" style="height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid {{c.input}}; background: {{c.card}}; color: {{c.text}}; font: 13.5px Inter"><option>Platform default (all sites)</option><option>shop.acme.lk</option><option>blog.acme.lk</option></select>
    </div>
    <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div role="status" style="padding: 10px 14px; border-radius: 8px; background: {{c.okBg}}; color: {{c.okFg}}; font-size: 13px; font-weight: 500">{{toastText}}</div></sc-if>
    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">
      <section aria-label="Pages" style="flex: 0 1 300px; min-width: 260px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; overflow: hidden">
        <sc-for list="{{pages}}" as="p" hint-placeholder-count="7">
          <button type="button" onClick="{{p.pick}}" style="{{p.style}}">
            <span style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span style="font-weight: 600; font-size: 14px">{{p.name}}</span><span style="{{p.badge}}">{{p.code}}</span></span>
            <span style="font-size: 12px; color: {{c.sub}}; line-height: 1.4">{{p.when}}</span>
          </button>
        </sc-for>
      </section>
      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <div style="padding: 16px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-items: end">
          <sc-for list="{{fields}}" as="f" hint-placeholder-count="3"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600">{{f.k}}<input value="{{f.v}}" style="height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid {{c.input}}; background: {{c.card}}; color: {{c.text}}; font: 13.5px Inter"></label></sc-for>
          <div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" onClick="{{save}}" style="{{btnPrimary}}">Save</button><button type="button" onClick="{{toggleMaint}}" style="{{maintBtn}}">{{maintLabel}}</button></div>
        </div>
        <div style="border-radius: 8px; border: 1px solid {{c.line}}; overflow: hidden; background: {{c.card}}">
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid {{c.line}}; background: {{c.head}}">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: #F87171"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #FBBF24"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #4ADE80"></span>
            <span style="flex: 1; margin-left: 8px; padding: 4px 10px; border-radius: 6px; background: {{c.card}}; border: 1px solid {{c.line}}; font: 12px 'JetBrains Mono', monospace; color: {{c.sub}}">https://shop.acme.lk{{path}}</span>
            <span style="font: 600 11.5px Inter; color: {{c.sub}}">HTTP {{status}}</span>
          </div>
          <dc-import name="PublicPage" kind="{{kind}}" site-name="Acme Shop" domain="shop.acme.lk" brand="#2563EB" dark="{{dark}}" hint-size="100%,900px"></dc-import>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1054}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 0, maint: false, toast: '' }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#2563EB';
    const st = this.state;
    const c = dark ? { bg:'#0B1120', card:'#111827', head:'#0F172A', text:'#F1F5F9', sub:'#94A3B8', line:'#1E293B', input:'#334155', soft:'#172554', okBg:'#052E1B', okFg:'#86EFAC' } : { bg:'#F8FAFC', card:'#FFFFFF', head:'#F8FAFC', text:'#0F172A', sub:'#475569', line:'#E2E8F0', input:'#CBD5E1', soft:'#EFF6FF', okBg:'#DCFCE7', okFg:'#166534' };
    const pill = (bg, fg) => `display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:${dark?'#1F2937':bg};color:${fg}`;
    const say = m => { this.setState({ toast: m }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2600); };
    const P = [
      ['maintenance','Maintenance','503','Shown while maintenance mode is on for a site or the platform','/', [['Title','We’ll be back shortly'],['Expected back','05:30 Asia/Colombo'],['Status page link','https://status.livezen.app']]],
      ['404','Page not found','404','When an app returns 404 with no page of its own','/old-promo', [['Title','This page doesn’t exist'],['Home link','/'],['Popular links','Shop, Blog, Help centre']]],
      ['overload','Server busy','503','When an app is over its rate or capacity limit, with auto-retry','/', [['Title','We’re getting a lot of visitors'],['Retry after (seconds)','30'],['Queue visitors','Off']]],
      ['suspended','Account suspended','403','When a hosting customer is suspended (unpaid or abuse)','/', [['Title','This site is temporarily unavailable'],['Owner sign-in link','https://cloud.livezen.app'],['Show reason to visitors','No']]],
      ['expired','Plan expired','402','When a customer’s package has expired; data kept for the grace period','/', [['Title','This site’s hosting plan has expired'],['Grace period (days)','30'],['Renew link','https://cloud.livezen.app/billing']]],
      ['botcheck','Bot check','200','Challenge page from the Firewall (managed check, JavaScript or CAPTCHA)','/login', [['Provider','Cloudflare Turnstile'],['Clearance lasts','30 minutes'],['Rules','Firewall → Challenges']]],
      ['welcome','Welcome','200','Placeholder for a connected domain with no app deployed','/', [['Title','{domain} is ready'],['Primary button','Open the control panel'],['Show to','Everyone']]],
    ];
    const cur = P[st.sel];
    const pages = P.map((p, i) => ({ name: p[1], code: p[2], when: p[3], badge: p[2] === '200' ? pill('#DCFCE7','#15803D') : p[2] === '404' ? pill('#F1F5F9','#334155') : pill('#FEF3C7','#B45309'),
      pick: () => this.setState({ sel: i }),
      style: `display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid ${c.line};border-left:3px solid ${i===st.sel?accent:'transparent'};cursor:pointer;text-align:left;font-family:Inter;color:${c.text};background:${i===st.sel?c.soft:c.card}` }));
    const base = 'display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:6px;font:600 13px Inter;cursor:pointer;';
    return { c, dark, accent, pages, kind: cur[0], path: cur[4], status: cur[2], fields: cur[5].map(([k, v]) => ({ k, v })),
      btnPrimary: base + `border:0;background:${accent};color:#fff`,
      maintBtn: base + (st.maint ? 'border:0;background:#DC2626;color:#fff' : `border:1px solid ${c.input};background:${c.card};color:${c.text}`),
      maintLabel: st.maint ? 'Maintenance ON · turn off' : 'Turn on maintenance',
      toggleMaint: () => { this.setState({ maint: !st.maint }); say(st.maint ? 'Maintenance off — sites are serving normally' : 'Maintenance on — visitors see the maintenance page; admins bypass with their session'); },
      save: () => say(`${cur[1]} page saved`), toast: !!st.toast, toastText: st.toast };
  }
  componentWillUnmount() { clearTimeout(this._t); }
}
</script>
</body>
</html>
