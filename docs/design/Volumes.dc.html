<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Volumes &amp; Storage — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1000px; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 260px; max-width: 272px"><dc-import name="Sidebar" active="7" dark="{{dark}}" accent="{{accent}}" hint-size="272px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; max-width: 1168px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Volumes &amp; Storage</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">Named volumes, bind mounts, block storage, NFS and object storage for backups</p>
      </div>
      <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 14px Inter">Create volume</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
      <sc-for list="{{pools}}" as="p" hint-placeholder-count="3">
        <div style="padding: 20px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 14px">{{p.name}}</span><span style="font-size: 13px; font-weight: 600">{{p.pct}}</span></div>
          <div style="height: 8px; border-radius: 4px; background: {{c.track}}"><div style="height: 8px; border-radius: 4px; width: {{p.pct}}; background: {{p.color}}"></div></div>
          <span style="font-size: 12px; color: {{c.muted}}">{{p.sub}}</span>
        </div>
      </sc-for>
    </div>
    <section style="border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; overflow: hidden">
      <h2 style="margin: 0; padding: 18px 20px 10px; font-size: 15px; font-weight: 600">Volumes</h2>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 780px">
          <thead><tr style="text-align: left; color: {{c.muted}}; font-size: 12px; background: {{c.head}}"><sc-for list="{{cols}}" as="h" hint-placeholder-count="6"><th style="padding: 10px 16px; font-weight: 600">{{h}}</th></sc-for></tr></thead>
          <tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><tr style="border-top: 1px solid {{c.line}}"><sc-for list="{{r.cells}}" as="x" hint-placeholder-count="6"><td style="padding: 12px 16px"><span style="{{x.s}}">{{x.t}}</span></td></sc-for></tr></sc-for></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const c = dark
      ? { bg:'#0B1120', card:'#111827', head:'#0F172A', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B', track:'#1E293B' }
      : { bg:'#F8FAFC', card:'#FFFFFF', head:'#F8FAFC', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0', track:'#EEF2F7' };
    const tones = dark
      ? { g:['#052E1B','#4ADE80'], y:['#3A2A05','#FACC15'], r:['#3B0D0D','#F87171'] }
      : { g:['#ECFDF3','#15803D'], y:['#FEF9C3','#854D0E'], r:['#FEF2F2','#B91C1C'] };
    const B = t => `display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:${tones[t][0]};color:${tones[t][1]}`;
    const T = (t, s) => ({ t, s: s || `color:${c.muted};white-space:nowrap` });
    const M = t => T(t, `font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:${c.text};white-space:nowrap`);
    const data = [
      ['pg_data','named volume','ded-eu-01','38 GB','postgres-main','pg_dump daily','g'],
      ['minio_data','block storage','ded-eu-01','410 GB','minio','Restic every 6 h','g'],
      ['wp_content','named volume','vps-sg-01','4.2 GB','wordpress-blog','last run failed','r'],
      ['n8n_data','named volume','vps-sg-01','1.1 GB','n8n','no policy','y'],
      ['shared_media','NFS mount','nas-01 → 3 servers','1.9 TB','web-frontend, api','snapshot nightly','g'],
      ['grafana_data','named volume','vps-eu-01','620 MB','grafana','Restic daily','g'],
    ];
    return { c, dark, accent,
      pools: [['Local SSD / NVMe','1.2 TB of 2 TB',60,accent],['NFS / NAS','3.1 TB of 8 TB',39,accent],['Object storage (backups)','4.4 TB of 5 TB quota',88,'#DC2626']].map(([name, sub, v, color]) => ({ name, sub, pct: v+'%', color })),
      cols: ['Volume','Type','Server','Size','Mounted by','Backup'],
      rows: data.map(d => ({ cells: [M(d[0]), T(d[1]), T(d[2]), T(d[3]), T(d[4]), T(d[5], B(d[6]))] })) };
  }
}
</script>
</body>
</html>
