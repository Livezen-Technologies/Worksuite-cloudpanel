<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Images &amp; Registry — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1000px; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 260px; max-width: 272px"><dc-import name="Sidebar" active="5" dark="{{dark}}" accent="{{accent}}" hint-size="272px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; max-width: 1168px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Images &amp; Registry</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">Images on each server, connected registries and vulnerability scans</p>
      </div>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 600 14px Inter">Add registry</button>
      <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 14px Inter">Pull image</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
      <sc-for list="{{regs}}" as="r" hint-placeholder-count="3">
        <div style="padding: 18px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 700; font-size: 14px">{{r.name}}</span><span style="{{r.badge}}">connected</span></div>
          <span style="font-size: 12px; color: {{c.muted}}">{{r.sub}}</span>
        </div>
      </sc-for>
    </div>
    <section style="border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; overflow: hidden">
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 20px; border-bottom: 1px solid {{c.line}}">
        <h2 style="flex: 1; margin: 0; font-size: 15px; font-weight: 600">Images</h2>
        <span style="font-size: 13px; color: {{c.muted}}">1 dangling · 640 MB reclaimable</span>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 600 13px Inter">Prune unused</button>
      </div>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 820px">
          <thead><tr style="text-align: left; color: {{c.muted}}; font-size: 12px; background: {{c.head}}"><sc-for list="{{cols}}" as="h" hint-placeholder-count="7"><th style="padding: 10px 16px; font-weight: 600">{{h}}</th></sc-for></tr></thead>
          <tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><tr style="border-top: 1px solid {{c.line}}"><sc-for list="{{r.cells}}" as="x" hint-placeholder-count="7"><td style="padding: 12px 16px"><span style="{{x.s}}">{{x.t}}</span></td></sc-for></tr></sc-for></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const c = dark
      ? { bg:'#0B1120', card:'#111827', head:'#0F172A', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B' }
      : { bg:'#F8FAFC', card:'#FFFFFF', head:'#F8FAFC', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0' };
    const tones = dark
      ? { g:['#052E1B','#4ADE80'], y:['#3A2A05','#FACC15'], r:['#3B0D0D','#F87171'], n:['#1E293B','#CBD5E1'] }
      : { g:['#ECFDF3','#15803D'], y:['#FEF9C3','#854D0E'], r:['#FEF2F2','#B91C1C'], n:['#F1F5F9','#475569'] };
    const B = t => `display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:${tones[t][0]};color:${tones[t][1]}`;
    const T = (t, s) => ({ t, s: s || `color:${c.muted};white-space:nowrap` });
    const S = t => T(t, `font-weight:600;color:${c.text};white-space:nowrap`);
    const M = t => T(t, `font-family:'JetBrains Mono',monospace;font-size:11.5px;color:${c.muted};white-space:nowrap`);
    const data = [
      ['ghcr.io/acme/api','5.2.0','sha256:9f2c…e81','212 MB','2 containers','0 critical · 2 medium','y','vps-eu-02'],
      ['ghcr.io/acme/web','2.8.1','sha256:41aa…0c3','86 MB','1 container','clean','g','vps-eu-01'],
      ['postgres','16.4','sha256:aa10…772','438 MB','1 container','1 high · 4 medium','r','ded-eu-01'],
      ['n8nio/n8n','1.64.0','sha256:be7d…19f','1.1 GB','1 container','2 high · 7 medium','r','vps-sg-01'],
      ['traefik','v3.1','sha256:7c02…aa1','168 MB','1 container','clean','g','vps-eu-01'],
      ['<none>','<none>','sha256:01ff…9b2','640 MB','dangling','—','n','vps-eu-02'],
    ];
    return { c, dark, accent,
      regs: [['GitHub Container Registry','ghcr.io · token auth'],['Docker Hub','pull-through mirror on 4 servers'],['Private Gitea registry','git.acme.io · robot account']].map(([name, sub]) => ({ name, sub, badge:B('g') })),
      cols: ['Repository','Tag','Digest','Size','Used by','Vulnerabilities','Server'],
      rows: data.map(d => ({ cells: [S(d[0]), M(d[1]), M(d[2]), T(d[3]), T(d[4]), T(d[5], B(d[6])), T(d[7])] })) };
  }
}
</script>
</body>
</html>
