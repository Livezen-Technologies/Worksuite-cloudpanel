<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1000px; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 260px; max-width: 272px"><dc-import name="Sidebar" active="15" dark="{{dark}}" accent="{{accent}}" hint-size="272px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; max-width: 1000px">
    <div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Settings</h1>
      <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">Organisation, security, notifications and provider integrations</p>
    </div>
    <div role="tablist" style="display: flex; flex-wrap: wrap; gap: 24px; border-bottom: 1px solid {{c.line}}">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button type="button" role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>

    <sc-if value="{{isGeneral}}" hint-placeholder-val="{{ true }}">
      <section style="padding: 24px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
        <label style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Organisation name<input value="Acme Hosting" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.bg}}; color: {{c.text}}; font: 14px Inter"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Default region<select style="height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.bg}}; color: {{c.text}}; font: 14px Inter"><option>eu-central</option><option>ap-southeast</option><option>us-east</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Audit retention (days)<input value="365" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.bg}}; color: {{c.text}}; font: 14px Inter"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Agent heartbeat (seconds)<input value="15" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.bg}}; color: {{c.text}}; font: 14px Inter"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Dashboard refresh (seconds)<input value="15" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.bg}}; color: {{c.text}}; font: 14px Inter"></label>
      </section>
    </sc-if>

    <sc-if value="{{isSecurity}}" hint-placeholder-val="{{ false }}">
      <section style="padding: 8px 24px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}">
        <sc-for list="{{policies}}" as="p" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid {{c.line}}">
            <div style="flex: 1"><div style="font-weight: 600; font-size: 14px">{{p.label}}</div><div style="font-size: 13px; color: {{c.muted}}; margin-top: 2px">{{p.sub}}</div></div>
            <button type="button" onClick="{{p.toggle}}" aria-label="{{p.label}}" style="{{p.track}}"><span style="{{p.knob}}"></span></button>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <sc-if value="{{isNotify}}" hint-placeholder-val="{{ false }}">
      <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
        <sc-for list="{{channels}}" as="ch" hint-placeholder-count="6">
          <div style="padding: 18px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 700">{{ch.name}}</span><span style="{{ch.badge}}">{{ch.state}}</span></div>
            <span style="font-size: 12px; color: {{c.muted}}">{{ch.sub}}</span>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <sc-if value="{{isProviders}}" hint-placeholder-val="{{ false }}">
      <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
        <sc-for list="{{providers}}" as="pr" hint-placeholder-count="6">
          <div style="padding: 18px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 700">{{pr.name}}</span><span style="{{pr.badge}}">{{pr.state}}</span></div>
            <span style="font-size: 12px; color: {{c.muted}}">{{pr.sub}}</span>
            <button type="button" style="align-self: flex-start; min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 600 13px Inter">{{pr.cta}}</button>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <sc-if value="{{isTokens}}" hint-placeholder-val="{{ false }}">
      <section style="border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; overflow: hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px"><h2 style="margin: 0; font-size: 15px">API tokens</h2><button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 13px Inter">Create token</button></div>
        <sc-for list="{{tokens}}" as="tk" hint-placeholder-count="3">
          <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 14px 20px; border-top: 1px solid {{c.line}}; font-size: 13px">
            <span style="flex: 1 1 200px; font-weight: 600">{{tk.name}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; color: {{c.muted}}">{{tk.prefix}}</span>
            <span style="color: {{c.muted}}">{{tk.scope}}</span>
            <span style="color: {{c.muted}}">{{tk.exp}}</span>
            <a href="#" style="font-weight: 600; color: {{c.danger}}">Revoke</a>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <div style="display: flex; justify-content: flex-end; gap: 10px">
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 600 14px Inter">Cancel</button>
      <button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 14px Inter">Save changes</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { tab: 0, pol: [true,true,true,true,false,true] }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const c = dark
      ? { bg:'#0B1120', card:'#111827', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B', track:'#334155', danger:'#F87171' }
      : { bg:'#F8FAFC', card:'#FFFFFF', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0', track:'#CBD5E1', danger:'#B91C1C' };
    const tones = dark
      ? { g:['#052E1B','#4ADE80'], n:['#1E293B','#CBD5E1'] }
      : { g:['#ECFDF3','#15803D'], n:['#F1F5F9','#475569'] };
    const B = t => `display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:${tones[t][0]};color:${tones[t][1]}`;
    const tab = this.state.tab;
    const tabs = ['General','Security','Notifications','Providers','API tokens'].map((label, i) => ({ label, pick: () => this.setState({ tab: i }),
      style:`min-height:44px;padding:0 2px;border:0;border-bottom:2px solid ${tab===i?accent:'transparent'};margin-bottom:-1px;background:transparent;cursor:pointer;font:600 14px Inter;color:${tab===i?accent:c.muted}` }));
    const pol = this.state.pol;
    const policies = [
      ['Require MFA for every member','Passkeys or TOTP before any session starts'],
      ['Approval for destructive production actions','Delete, restore and volume removal need a second approver'],
      ['Secure container defaults','Non-root user, dropped capabilities, no-new-privileges'],
      ['Encrypt all remote backups','Mandatory — keys held separately from backup storage'],
      ['Allow host networking','Only for approved system containers'],
      ['Block images with critical CVEs','Deployments fail if the scan finds a critical issue'],
    ].map(([label, sub], i) => ({ label, sub,
      toggle: () => { const n = pol.slice(); n[i] = !n[i]; this.setState({ pol: n }); },
      track:`position:relative;width:44px;height:26px;border-radius:13px;border:0;cursor:pointer;flex:none;background:${pol[i]?accent:c.track}`,
      knob:`position:absolute;top:3px;left:${pol[i]?21:3}px;width:20px;height:20px;border-radius:10px;background:#fff` }));
    const channels = [['Email','ops@acme.io','connected','g'],['Slack','#infra-alerts','connected','g'],['Microsoft Teams','not set up','off','n'],['Telegram','Ops bot','connected','g'],['Webhook','PagerDuty endpoint','connected','g'],['SMS','not set up','off','n']]
      .map(([name, sub, state, t]) => ({ name, sub, state, badge:B(t) }));
    const providers = [['Hetzner Cloud','Provision, power, snapshots','connected','g','Manage'],['DigitalOcean','Droplets in ap-southeast','connected','g','Manage'],['Vultr','1 server discovered','connected','g','Manage'],['AWS EC2','Not connected','off','n','Connect'],['Linode / Akamai','Not connected','off','n','Connect'],['Proxmox VE','Not connected','off','n','Connect']]
      .map(([name, sub, state, t, cta]) => ({ name, sub, state, badge:B(t), cta }));
    const tokens = [
      { name:'CI deploy (GitHub Actions)', prefix:'dmp_live_7Kq2…', scope:'deployments:write', exp:'expires in 82 days' },
      { name:'Grafana read-only', prefix:'dmp_live_p0aX…', scope:'metrics:read', exp:'no expiry' },
      { name:'Billing export', prefix:'dmp_live_Lm4c…', scope:'billing:read', exp:'expires in 12 days' },
    ];
    return { c, dark, accent, tabs, policies, channels, providers, tokens,
      isGeneral: tab===0, isSecurity: tab===1, isNotify: tab===2, isProviders: tab===3, isTokens: tab===4 };
  }
}
</script>
</body>
</html>
