<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automation — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1000px; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 260px; max-width: 272px"><dc-import name="Sidebar" active="13" dark="{{dark}}" accent="{{accent}}" hint-size="272px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; max-width: 1168px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Automation</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">Scheduled jobs, webhooks and maintenance windows</p>
      </div>
      <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 14px Inter">New job</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="6">
        <li style="padding: 18px 20px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
          <div style="flex: 1 1 280px; min-width: 0">
            <div style="font-weight: 700; font-size: 15px">{{j.name}}</div>
            <div style="font-size: 12px; color: {{c.muted}}; margin-top: 4px"><span style="font-family: 'JetBrains Mono', monospace">{{j.trigger}}</span> · {{j.target}}</div>
          </div>
          <div style="font-size: 12px; color: {{c.muted}}; min-width: 120px">Next: <span style="color: {{c.text}}; font-weight: 600">{{j.next}}</span></div>
          <span style="{{j.badge}}">{{j.last}}</span>
          <button type="button" onClick="{{j.toggle}}" aria-label="Enable {{j.name}}" style="{{j.track}}"><span style="{{j.knob}}"></span></button>
          <button type="button" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 600 13px Inter">Run now</button>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { off: { 5: true } }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const c = dark
      ? { bg:'#0B1120', card:'#111827', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B', track:'#334155' }
      : { bg:'#F8FAFC', card:'#FFFFFF', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0', track:'#CBD5E1' };
    const tones = dark
      ? { g:['#052E1B','#4ADE80'], b:['#0C2340','#60A5FA'], r:['#3B0D0D','#F87171'] }
      : { g:['#ECFDF3','#15803D'], b:['#EFF6FF','#1D4ED8'], r:['#FEF2F2','#B91C1C'] };
    const B = t => `display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:${tones[t][0]};color:${tones[t][1]}`;
    const off = this.state.off;
    const data = [
      ['Prune dangling images','cron 0 4 * * SUN','All servers','Sun 04:00','success','g'],
      ['Agent rolling upgrade','manual + approval','Production group','—','success','g'],
      ['Restore test: postgres-main','cron 0 5 1 * *','ded-eu-01 sandbox','Nov 1, 05:00','success','g'],
      ['Deploy on push','GitHub webhook','acme-core','on event','success','g'],
      ['Maintenance window','Sat 01:00–03:00','stg-eu-01','Sat 01:00','scheduled','b'],
      ['Rotate registry tokens','cron 0 3 1 */3 *','All registries','Jan 1','failed','r'],
    ];
    const jobs = data.map((d, i) => { const on = !off[i]; return {
      name:d[0], trigger:d[1], target:d[2], next: on ? d[3] : 'paused', last:d[4], badge:B(d[5]),
      toggle: () => this.setState({ off: { ...off, [i]: on } }),
      track:`position:relative;width:44px;height:26px;border-radius:13px;border:0;cursor:pointer;flex:none;background:${on?accent:c.track}`,
      knob:`position:absolute;top:3px;left:${on?21:3}px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)` }; });
    return { c, dark, accent, jobs };
  }
}
</script>
</body>
</html>
