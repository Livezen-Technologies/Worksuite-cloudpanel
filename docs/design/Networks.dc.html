<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Networks — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1000px; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 260px; max-width: 272px"><dc-import name="Sidebar" active="6" dark="{{dark}}" accent="{{accent}}" hint-size="272px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; max-width: 1168px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Networks</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">Bridge networks, approved host networking and the encrypted WireGuard mesh between servers</p>
      </div>
      <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 14px Inter">Create network</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <div style="padding: 18px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}"><div style="font-size: 13px; color: {{c.muted}}">{{t.k}}</div><div style="font-size: 24px; font-weight: 700; margin-top: 6px">{{t.v}}</div><div style="font-size: 12px; color: {{c.muted}}; margin-top: 2px">{{t.s}}</div></div>
      </sc-for>
    </div>
    <section style="border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; overflow: hidden">
      <h2 style="margin: 0; padding: 18px 20px 10px; font-size: 15px; font-weight: 600">All networks</h2>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 780px">
          <thead><tr style="text-align: left; color: {{c.muted}}; font-size: 12px; background: {{c.head}}"><sc-for list="{{cols}}" as="h" hint-placeholder-count="6"><th style="padding: 10px 16px; font-weight: 600">{{h}}</th></sc-for></tr></thead>
          <tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><tr style="border-top: 1px solid {{c.line}}"><sc-for list="{{r.cells}}" as="x" hint-placeholder-count="6"><td style="padding: 12px 16px"><span style="{{x.s}}">{{x.t}}</span></td></sc-for></tr></sc-for></tbody>
        </table>
      </div>
    </section>
    <div style="padding: 14px 16px; border-radius: 10px; background: {{c.warnBg}}; color: {{c.warnFg}}; font-size: 13px">Every network change is audited and checked for port conflicts, IP conflicts and accidental public exposure before it is applied.</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const c = dark
      ? { bg:'#0B1120', card:'#111827', head:'#0F172A', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B', warnBg:'#3A2A05', warnFg:'#FDE68A' }
      : { bg:'#F8FAFC', card:'#FFFFFF', head:'#F8FAFC', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0', warnBg:'#FEF9C3', warnFg:'#713F12' };
    const tones = dark
      ? { g:['#052E1B','#4ADE80'], y:['#3A2A05','#FACC15'], b:['#0C2340','#60A5FA'], n:['#1E293B','#CBD5E1'] }
      : { g:['#ECFDF3','#15803D'], y:['#FEF9C3','#854D0E'], b:['#EFF6FF','#1D4ED8'], n:['#F1F5F9','#475569'] };
    const B = t => `display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:${tones[t][0]};color:${tones[t][1]}`;
    const T = (t, s) => ({ t, s: s || `color:${c.muted};white-space:nowrap` });
    const S = t => T(t, `font-weight:600;color:${c.text};white-space:nowrap`);
    const M = t => T(t, `font-family:'JetBrains Mono',monospace;font-size:11.5px;color:${c.muted};white-space:nowrap`);
    const data = [
      ['proxy','bridge','172.20.0.0/16','vps-eu-01','6','public via Traefik','b'],
      ['internal','bridge','172.21.0.0/16','vps-eu-02','4','private','g'],
      ['db-net','bridge','172.22.0.0/24','ded-eu-01','3','private','g'],
      ['wg-mesh','WireGuard','10.80.0.0/24','all servers','—','encrypted','g'],
      ['backup-net','bridge','172.23.0.0/24','ded-eu-01','2','private','g'],
      ['host','host','—','ded-eu-01','1 (node-exporter)','approved exception','y'],
    ];
    return { c, dark, accent,
      tiles: [{k:'Networks',v:'14',s:'across 6 servers'},{k:'Publicly exposed',v:'2',s:'both behind Traefik'},{k:'Mesh peers',v:'6 / 6',s:'WireGuard handshakes ok'},{k:'Port conflicts',v:'0',s:'last check 2 min ago'}],
      cols: ['Name','Driver','Subnet','Server','Containers','Exposure'],
      rows: data.map(d => ({ cells: [S(d[0]), T(d[1]), M(d[2]), T(d[3]), T(d[4]), T(d[5], B(d[6]))] })) };
  }
}
</script>
</body>
</html>
