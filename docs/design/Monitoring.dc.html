<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monitoring — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}; min-height: 1000px; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 260px; max-width: 272px"><dc-import name="Sidebar" active="11" dark="{{dark}}" accent="{{accent}}" hint-size="272px,1000px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; max-width: 1168px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1; min-width: 240px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Monitoring</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">Prometheus metrics, Loki logs and alert rules</p>
      </div>
      <select aria-label="Server" style="height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 14px Inter"><option>All servers</option><option>vps-eu-02</option><option>ded-eu-01</option></select>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.text}}; font: 600 14px Inter">Open Grafana</button>
    </div>
    <section style="padding: 20px; border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Fleet resources</h2>
        <div style="display: flex; gap: 8px"><sc-for list="{{toggles}}" as="t" hint-placeholder-count="3"><button type="button" onClick="{{t.pick}}" style="{{t.style}}"><span style="width: 10px; height: 3px; background: {{t.color}}"></span>{{t.label}}</button></sc-for></div>
      </div>
      <svg viewBox="0 0 640 220" role="img" aria-label="CPU, RAM and disk usage over six hours" style="width: 100%; height: auto; margin-top: 12px">
        <g stroke="{{c.line}}"><line x1="36" x2="630" y1="12" y2="12"/><line x1="36" x2="630" y1="60" y2="60"/><line x1="36" x2="630" y1="108" y2="108"/><line x1="36" x2="630" y1="156" y2="156"/><line x1="36" x2="630" y1="196" y2="196"/></g>
        <g fill="{{c.muted}}" font-size="10" font-family="Inter" text-anchor="end"><text x="30" y="16">100%</text><text x="30" y="64">75%</text><text x="30" y="112">50%</text><text x="30" y="160">25%</text><text x="30" y="200">0%</text></g>
        <g fill="{{c.muted}}" font-size="10" font-family="Inter" text-anchor="middle"><text x="36" y="214">09:00</text><text x="135" y="214">10:00</text><text x="234" y="214">11:00</text><text x="333" y="214">12:00</text><text x="432" y="214">13:00</text><text x="531" y="214">14:00</text><text x="626" y="214">15:00</text></g>
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="3"><path d="{{l.d}}" fill="none" stroke="{{l.color}}" stroke-width="2.2" stroke-linejoin="round"/></sc-for>
      </svg>
    </section>
    <section style="border-radius: 12px; background: {{c.card}}; border: 1px solid {{c.line}}; overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 10px"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Alert rules</h2><button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: {{accent}}; color: #fff; font: 600 13px Inter">Add rule</button></div>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 820px">
          <thead><tr style="text-align: left; color: {{c.muted}}; font-size: 12px; background: {{c.head}}"><sc-for list="{{cols}}" as="h" hint-placeholder-count="5"><th style="padding: 10px 16px; font-weight: 600">{{h}}</th></sc-for></tr></thead>
          <tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="7"><tr style="border-top: 1px solid {{c.line}}"><sc-for list="{{r.cells}}" as="x" hint-placeholder-count="5"><td style="padding: 12px 16px"><span style="{{x.s}}">{{x.t}}</span></td></sc-for></tr></sc-for></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0284C7","#0D9488","#EA580C"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { on: { CPU:true, RAM:true, Disk:true } }; }
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const c = dark
      ? { bg:'#0B1120', card:'#111827', head:'#0F172A', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B' }
      : { bg:'#F8FAFC', card:'#FFFFFF', head:'#F8FAFC', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0' };
    const tones = dark
      ? { y:['#3A2A05','#FACC15'], r:['#3B0D0D','#F87171'] }
      : { y:['#FEF9C3','#854D0E'], r:['#FEF2F2','#B91C1C'] };
    const B = t => `display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:${tones[t][0]};color:${tones[t][1]}`;
    const T = (t, s) => ({ t, s: s || `color:${c.muted};white-space:nowrap` });
    const S = t => T(t, `font-weight:600;color:${c.text};white-space:nowrap`);
    const X = i => 36 + i*49.5, Y = v => 196 - v*1.84;
    const path = d => d.map((v,i) => (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const series = [['CPU', accent, [34,38,41,45,52,48,44,57,61,49,42,40,42]], ['RAM', '#0D9488', [58,59,61,62,64,66,65,67,69,68,67,68,68]], ['Disk', '#D97706', [54,54,55,55,55,56,56,56,57,57,57,58,58]]];
    const on = this.state.on;
    const toggles = series.map(([label, color]) => ({ label, color, pick: () => this.setState({ on: { ...on, [label]: !on[label] } }),
      style:`display:flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;font:600 12px Inter;cursor:pointer;border:1px solid ${c.line};background:${on[label]?c.card:c.head};color:${on[label]?c.text:c.muted};opacity:${on[label]?1:0.6}` }));
    const rules = [
      ['CPU utilisation','> 90% for 10 min','warning','y','All servers · Slack'],
      ['RAM utilisation','> 90% for 5 min','warning','y','All servers · Slack'],
      ['Disk utilisation','> 85%','warning','y','All servers · Slack, email'],
      ['Server disconnected','Heartbeat timeout','critical','r','All servers · Telegram, webhook'],
      ['Container unhealthy','Repeated failed checks','critical','r','Production · Slack, Teams'],
      ['Backup failed','Job unsuccessful','critical','r','All · email'],
      ['SSL expiry','< 14 days','warning','y','All domains · email'],
    ];
    return { c, dark, accent, toggles,
      lines: series.filter(([l]) => on[l]).map(([, color, d]) => ({ color, d: path(d) })),
      cols: ['Condition','Threshold','Severity','Scope · channels','Enabled'],
      rows: rules.map(r => ({ cells: [S(r[0]), T(r[1]), T(r[2], B(r[3])), T(r[4]), T('On', `font-weight:600;color:${accent}`)] })) };
  }
}
</script>
</body>
</html>
