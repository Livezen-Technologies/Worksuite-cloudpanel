<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar — Docker Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<nav aria-label="Main" style="font-family: Inter, system-ui, sans-serif; color: {{c.text}}; width: 272px; min-height: 1000px; height: 100%; box-sizing: border-box; padding: 20px 16px; background: {{c.side}}; border-right: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
    <span style="width: 34px; height: 34px; border-radius: 9px; background: {{accent}}; display: flex; align-items: center; justify-content: center; color: #fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div><div style="font-weight: 700; font-size: 15px">Docker Manager</div><div style="font-size: 12px; color: {{c.muted}}">Acme Hosting</div></div>
  </div>
  <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="16">
      <li><a href="{{n.href}}" style="{{n.style}}"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{n.dot}}"></span>{{n.label}}</a></li>
    </sc-for>
  </ul>
  <div style="margin-top: auto; padding: 14px; border-radius: 10px; background: {{c.card}}; border: 1px solid {{c.line}}">
    <div style="font-size: 12px; color: {{c.muted}}">Control plane</div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>All systems operational</div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"int","default":0,"min":0,"max":15},"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5"},"$preview":{"width":272,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#4F46E5';
    const active = Number(this.props.active ?? 0);
    const c = dark
      ? { side:'#0F172A', card:'#111827', text:'#F1F5F9', muted:'#94A3B8', line:'#1E293B' }
      : { side:'#FFFFFF', card:'#F8FAFC', text:'#0F172A', muted:'#5B6475', line:'#E2E8F0' };
    const items = [['Overview','Main'],['Servers','Servers'],['Containers','Containers'],['Applications','Applications'],['Compose Stacks','Compose'],['Images & Registry','Images'],['Networks','Networks'],['Volumes & Storage','Volumes'],['Domains & SSL','Domains'],['Databases','Databases'],['Backups','Backups'],['Monitoring','Monitoring'],['Logs & Terminal','Logs'],['Automation','Automation'],['Users & Teams','Users'],['Settings','Settings']];
    const nav = items.map(([label, f], i) => { const on = i===active; return { label, href: f + '.dc.html', dot: on?accent:'transparent',
      style:`display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:${on?600:500};color:${on?(dark?'#fff':accent):c.muted};background:${on?(dark?'#1E293B':'#EEF2FF'):'transparent'}` }; });
    return { c, accent, nav };
  }
}
</script>
</body>
</html>
