# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: vikunja-with-postgresql
name: Vikunja With Postgresql
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: The open-source, self-hostable to-do app. Organize everything, on all platforms.
port: 3456
source: coolify
documentation: https://vikunja.io
compose: "services:\n  vikunja:\n    image: vikunja/vikunja\n    environment:\n      VIKUNJA_SERVICE_PUBLICURL: ${SERVICE_URL}\n      VIKUNJA_SERVICE_SECRET: ${SERVICE_PASSWORD_JWTSECRET}\n      VIKUNJA_SERVICE_ENABLEREGISTRATION: 'true'\n      VIKUNJA_DATABASE_TYPE: postgres\n      VIKUNJA_DATABASE_HOST: postgresql\n      VIKUNJA_DATABASE_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      VIKUNJA_DATABASE_USER: ${SERVICE_USER_POSTGRESQL}\n      VIKUNJA_DATABASE_DATABASE: ${POSTGRESQL_DATABASE}\n    volumes:\n    - vikunja-data:/app/vikunja/\n    healthcheck:\n      test:\n      - CMD\n      - /app/vikunja/vikunja\n      - healthcheck\n      interval: 30s\n      timeout: 5s\n      retries: 3\n      start_period: 15s\n    depends_on:\n      postgresql:\n        condition: service_healthy\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3456'\n  postgresql:\n    image:\
  \ postgres:16-alpine\n    volumes:\n    - vikunja-postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRESQL_DATABASE}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  vikunja-data: {}\n  vikunja-postgresql-data: {}\n"
