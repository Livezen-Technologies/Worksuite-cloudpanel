# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: wordpress-without-database
name: Wordpress Without Database
category: CMS
version: 1
type: compose
accent: '#6B16ED'
description: WordPress is open source software you can use to create a beautiful website, blog, or app.
port: 80
source: coolify
documentation: https://wordpress.org
compose: "services:\n  wordpress:\n    image: wordpress:latest\n    volumes:\n    - wordpress-files:/var/www/html\n    environment: {}\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1\n      interval: 2s\n      timeout: 10s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\nvolumes:\n  wordpress-files: {}\n"
