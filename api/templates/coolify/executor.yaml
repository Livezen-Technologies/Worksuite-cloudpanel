# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: executor
name: Executor
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: Self-hosted AI agent integrations and code execution server.
port: 4788
source: coolify
documentation: https://executor.sh/docs/hosted/docker
compose: "services:\n  executor:\n    image: ghcr.io/rhyssullivan/executor-selfhost:${EXECUTOR_VERSION:-latest}\n    environment:\n      EXECUTOR_WEB_BASE_URL: ${SERVICE_URL}\n      EXECUTOR_HOST: ${EXECUTOR_HOST:-0.0.0.0}\n      PORT: ${PORT:-4788}\n      EXECUTOR_DATA_DIR: /data\n      EXECUTOR_DB_PATH: ${EXECUTOR_DB_PATH:-/data/data.db}\n      EXECUTOR_ORG_NAME: ${EXECUTOR_ORG_NAME:-Default}\n      EXECUTOR_ORG_SLUG: ${EXECUTOR_ORG_SLUG:-default}\n      EXECUTOR_ALLOW_LOCAL_NETWORK: ${EXECUTOR_ALLOW_LOCAL_NETWORK:-false}\n    volumes:\n    - executor-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - bun\n      - -e\n      - fetch(`http://127.0.0.1:${process.env.PORT||4788}/api/health`).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\n      interval: 30s\n      timeout: 5s\n      retries: 5\n      start_period: 20s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port:\
  \ '4788'\nvolumes:\n  executor-data: {}\n"
