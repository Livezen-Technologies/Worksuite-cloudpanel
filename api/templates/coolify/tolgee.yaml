# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: tolgee
name: Tolgee
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Tolgee is a localization management platform for developers and translators.
port: 8080
source: coolify
documentation: https://tolgee.io/
compose: "services:\n  tolgee:\n    image: tolgee/tolgee\n    environment:\n      TOLGEE_AUTHENTICATION_ENABLED: 'true'\n      TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: ${SERVICE_PASSWORD_TOLGEE}\n      TOLGEE_AUTHENTICATION_INITIAL_USERNAME: admin\n      TOLGEE_AUTHENTICATION_JWT_SECRET: ${SERVICE_PASSWORD_JWT}\n      TOLGEE_POSTGRES_AUTOSTART_ENABLED: 'false'\n      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-tolgee}\n      SPRING_DATASOURCE_USERNAME: ${SERVICE_USER_POSTGRESQL}\n      SPRING_DATASOURCE_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n    volumes:\n    - tolgee-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - -q\n      - --spider\n      - http://127.0.0.1:8080\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    depends_on:\n      postgresql:\n        condition: service_healthy\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port:\
  \ '8080'\n  postgresql:\n    image: postgres:16-alpine\n    volumes:\n    - tolgee-postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRESQL_DATABASE:-tolgee}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $tolgee\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  tolgee-data: {}\n  tolgee-postgresql-data: {}\n"
