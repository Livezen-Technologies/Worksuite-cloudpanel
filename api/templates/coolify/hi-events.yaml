# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: hi-events
name: Hi Events
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Open-source event management and ticketing platform.
port: 80
source: coolify
documentation: https://hi.events/docs
compose: "services:\n  hi-events:\n    image: daveearley/hi.events-all-in-one:v2.0.0\n    environment:\n      VITE_APP_NAME: ${VITE_APP_NAME:-Hi.Events}\n      VITE_FRONTEND_URL: ${SERVICE_URL}\n      VITE_API_URL_CLIENT: ${SERVICE_URL}/api\n      VITE_API_URL_SERVER: http://localhost:80/api\n      VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLIC_KEY}\n      APP_KEY: base64:${SERVICE_BASE64_APPKEY}\n      JWT_SECRET: ${SERVICE_BASE64_JWTSECRET}\n      APP_FRONTEND_URL: ${SERVICE_URL}\n      APP_CDN_URL: ${SERVICE_URL}/storage\n      APP_DISABLE_REGISTRATION: ${APP_DISABLE_REGISTRATION:-false}\n      APP_SAAS_MODE_ENABLED: ${APP_SAAS_MODE_ENABLED:-false}\n      APP_SAAS_STRIPE_APPLICATION_FEE_PERCENT: ${APP_SAAS_STRIPE_APPLICATION_FEE_PERCENT:-0}\n      APP_SAAS_STRIPE_APPLICATION_FEE_FIXED: ${APP_SAAS_STRIPE_APPLICATION_FEE_FIXED:-0}\n      APP_EMAIL_LOGO_URL: ${APP_EMAIL_LOGO_URL}\n      APP_EMAIL_LOGO_LINK_URL: ${APP_EMAIL_LOGO_LINK_URL}\n      LOG_CHANNEL: stderr\n      QUEUE_CONNECTION:\
  \ redis\n      DB_CONNECTION: pgsql\n      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-hi-events}\n      REDIS_HOST: redis\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n      REDIS_PORT: '6379'\n      MAIL_MAILER: ${MAIL_MAILER:-log}\n      MAIL_HOST: ${MAIL_HOST}\n      MAIL_PORT: ${MAIL_PORT:-587}\n      MAIL_USERNAME: ${MAIL_USERNAME}\n      MAIL_PASSWORD: ${MAIL_PASSWORD}\n      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}\n      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}\n      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Hi.Events}\n      FILESYSTEM_PUBLIC_DISK: public\n      FILESYSTEM_PRIVATE_DISK: local\n      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}\n      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}\n      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}\n      WEBHOOK_QUEUE_NAME: webhook-queue\n    volumes:\n    - hi-events-storage:/app/backend/storage/app\n    depends_on:\n      postgres:\n        condition:\
  \ service_healthy\n      redis:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -fsS\n      - -o\n      - /dev/null\n      - http://127.0.0.1:80/\n      interval: 10s\n      timeout: 10s\n      retries: 10\n      start_period: 30s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  postgres:\n    image: postgres:17-alpine\n    environment:\n      POSTGRES_DB: ${POSTGRES_DB:-hi-events}\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n    volumes:\n    - hi-events-postgres-data:/var/lib/postgresql/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $hi-events\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  redis:\n    image: redis:7-alpine\n    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}\n\
  \    environment:\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n    volumes:\n    - hi-events-redis-data:/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG\n      interval: 5s\n      timeout: 10s\n      retries: 10\nvolumes:\n  hi-events-storage: {}\n  hi-events-postgres-data: {}\n  hi-events-redis-data: {}\n"
