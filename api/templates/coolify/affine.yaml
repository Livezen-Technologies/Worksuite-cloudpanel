# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: affine
name: Affine
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Affine is an open-source, all-in-one workspace and OS for knowledge management, a Notion/Miro alternative.
port: 3010
source: coolify
documentation: https://docs.affine.pro/docs/self-host-affine
compose: "services:\n  affine:\n    image: ghcr.io/toeverything/affine:stable\n    depends_on:\n      redis:\n        condition: service_healthy\n      postgres:\n        condition: service_healthy\n    volumes:\n    - affine-config:/root/.affine/config\n    - affine-storage:/root/.affine/storage\n    logging:\n      driver: json-file\n      options:\n        max-size: 1000m\n    environment:\n      AFFINE_CONFIG_PATH: /root/.affine/config\n      REDIS_SERVER_HOST: redis\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-affine}\n      NODE_ENV: production\n      AFFINE_SERVER_HOST: ${SERVICE_URL}\n      AFFINE_SERVER_EXTERNAL_URL: ${SERVICE_URL}\n      MAILER_HOST: ${MAILER_HOST}\n      MAILER_PORT: ${MAILER_PORT}\n      MAILER_USER: ${MAILER_USER}\n      MAILER_PASSWORD: ${MAILER_PASSWORD}\n      MAILER_SENDER: ${MAILER_SENDER}\n      COPILOT_FAL_API_KEY: ${COPILOT_FAL_API_KEY}\n      COPILOT_PERPLEXITY_API_KEY: ${COPILOT_PERPLEXITY_API_KEY}\n\
  \      COPILOT_OPENAI_API_KEY: ${COPILOT_OPENAI_API_KEY}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - bash -c ':> /dev/tcp/127.0.0.1/3010' || exit 1\n      interval: 5s\n      timeout: 20s\n      retries: 3\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3010'\n  affine_migration:\n    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}\n    restart: on-failure\n    volumes:\n    - affine-storage:/root/.affine/storage\n    - affine-config:/root/.affine/config\n    command:\n    - sh\n    - -c\n    - node ./scripts/self-host-predeploy.js\n    environment:\n      REDIS_SERVER_HOST: redis\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-affine}\n      AFFINE_INDEXER_ENABLED: 'false'\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition:\
  \ service_healthy\n  redis:\n    image: redis\n    volumes:\n    - affine-redis-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - --raw\n      - incr\n      - ping\n      interval: 10s\n      timeout: 5s\n      retries: 5\n  postgres:\n    image: pgvector/pgvector:pg16\n    volumes:\n    - affine-postgres-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-affine}\n      PGDATA: /var/lib/postgresql/data/pgdata\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $affine\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  affine-config: {}\n  affine-storage: {}\n  affine-redis-data: {}\n  affine-postgres-data: {}\n"
