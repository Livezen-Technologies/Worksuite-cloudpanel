# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: cyberchef
name: Cyberchef
category: Security
version: 1
type: compose
accent: '#6B16ED'
description: The Cyber Swiss Army Knife - a web app for encryption, encoding, compression and data analysis
port: 8080
source: coolify
documentation: https://github.com/gchq/CyberChef
compose: "services:\n  cyberchef:\n    image: ghcr.io/gchq/cyberchef:latest\n    platform: linux/amd64\n    environment: {}\n    volumes:\n    - cyberchef-data:/app/data\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:8080\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8080'\nvolumes:\n  cyberchef-data: {}\n"
