# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: espocrm
name: Espocrm
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: EspoCRM is a free and open-source CRM platform.
port: 80
source: coolify
documentation: https://docs.espocrm.com
compose: "services:\n  espocrm:\n    image: espocrm/espocrm:10\n    container_name: espocrm\n    environment:\n      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}\n      ESPOCRM_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}\n      ESPOCRM_DATABASE_PLATFORM: Mysql\n      ESPOCRM_DATABASE_HOST: espocrm-db\n      ESPOCRM_DATABASE_NAME: ${MARIADB_DATABASE:-espocrm}\n      ESPOCRM_DATABASE_USER: ${SERVICE_USER_MARIADB}\n      ESPOCRM_DATABASE_PASSWORD: ${SERVICE_PASSWORD_MARIADB}\n      ESPOCRM_SITE_URL: ${SERVICE_URL}\n    volumes:\n    - espocrm-data:/var/www/html/data\n    - espocrm-custom:/var/www/html/custom\n    - espocrm-custom-client:/var/www/html/client/custom\n    restart: unless-stopped\n    depends_on:\n      espocrm-db:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - bin/command\n      - app-check\n      start_period: 20s\n      interval: 60s\n      timeout: 20s\n      retries: 3\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule:\
  \ Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  espocrm-daemon:\n    image: espocrm/espocrm:10\n    container_name: espocrm-daemon\n    volumes_from:\n    - espocrm\n    restart: unless-stopped\n    entrypoint: docker-daemon.sh\n    depends_on:\n      espocrm:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - bin/command\n      - app-check\n      start_period: 20s\n      interval: 180s\n      timeout: 20s\n      retries: 3\n  espocrm-websocket:\n    image: espocrm/espocrm:10\n    container_name: espocrm-websocket\n    environment:\n      ESPOCRM_CONFIG_USE_WEB_SOCKET: 'true'\n      ESPOCRM_CONFIG_WEB_SOCKET_URL: ${SERVICE_URL}\n      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: tcp://*:7777\n      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: tcp://espocrm-websocket:7777\n    volumes_from:\n    - espocrm\n    restart: unless-stopped\n    entrypoint: docker-websocket.sh\n    depends_on:\n\
  \      espocrm:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - bin/command\n      - app-check\n      start_period: 20s\n      interval: 180s\n      timeout: 20s\n      retries: 3\n  espocrm-db:\n    image: mariadb:12.3\n    container_name: espocrm-db\n    environment:\n      MARIADB_DATABASE: ${MARIADB_DATABASE:-espocrm}\n      MARIADB_USER: ${SERVICE_USER_MARIADB}\n      MARIADB_PASSWORD: ${SERVICE_PASSWORD_MARIADB}\n      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT}\n    volumes:\n    - espocrm-db:/var/lib/mysql\n    restart: unless-stopped\n    healthcheck:\n      test:\n      - CMD\n      - healthcheck.sh\n      - --connect\n      - --innodb_initialized\n      interval: 20s\n      start_period: 10s\n      timeout: 10s\n      retries: 3\nvolumes:\n  espocrm-data: {}\n  espocrm-custom: {}\n  espocrm-custom-client: {}\n  espocrm-db: {}\n"
