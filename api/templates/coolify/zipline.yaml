# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: zipline
name: Zipline
category: Media
version: 1
type: compose
accent: '#6B16ED'
description: A ShareX/file upload server that is easy to use, packed with features, and with an easy setup!
port: 3000
source: coolify
documentation: https://zipline.diced.sh/docs/config
compose: "services:\n  zipline:\n    image: ghcr.io/diced/zipline:latest\n    environment:\n      CORE_RETURN_HTTPS: ${CORE_RETURN_HTTPS:-false}\n      CORE_SECRET: ${SERVICE_PASSWORD_ZIPLINE}\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres/${POSTGRES_DB:-zipline-db}\n      CORE_LOGGER: ${CORE_LOGGER:-true}\n    volumes:\n    - zipline-uploads:/zipline/uploads\n    - zipline-public:/zipline/public\n    depends_on:\n      postgres:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - -q\n      - --spider\n      - http://127.0.0.1:3000/auth/login\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  postgres:\n    image: postgres:16-alpine\n    volumes:\n    - zipline-postgres-data:/var/lib/postgresql/data\n\
  \    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-zipline-db}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $zipline-db\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  zipline-uploads: {}\n  zipline-public: {}\n  zipline-postgres-data: {}\n"
