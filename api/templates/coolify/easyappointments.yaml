# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: easyappointments
name: Easyappointments
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Schedule Anything. Let's start with easy! Get the best free online appointment scheduler on your server, today.
port: 80
source: coolify
documentation: https://easyappointments.org/
compose: "services:\n  easyappointments:\n    image: alextselegidis/easyappointments:latest\n    environment:\n      BASE_URL: ${SERVICE_URL}\n      DB_HOST: mysql\n      DB_NAME: easyappointments\n      DB_USERNAME: root\n      DB_PASSWORD: ${SERVICE_PASSWORD_EASYAPPOINTMENTS}\n    depends_on:\n    - mysql\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1\n      interval: 2s\n      timeout: 10s\n      retries: 30\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  mysql:\n    image: mysql:8\n    volumes:\n    - easyappointments-mysql-data:/var/lib/mysql\n    environment:\n      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_EASYAPPOINTMENTS}\n      MYSQL_DATABASE: easyappointments\n    healthcheck:\n      test:\n      - CMD\n      - mysqladmin\n      - ping\n      - -h\n      - 127.0.0.1\n      interval: 5s\n      timeout:\
  \ 20s\n      retries: 10\nvolumes:\n  easyappointments-mysql-data: {}\n"
