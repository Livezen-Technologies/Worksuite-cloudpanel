# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: hermes-agent
name: Hermes Agent
category: AI
version: 1
type: compose
accent: '#6B16ED'
description: Hermes Agent - autonomous AI agent with persistent memory, scheduling, and built-in web dashboard.
port: 9119
source: coolify
documentation: https://github.com/NousResearch/hermes-agent
compose: "services:\n  hermes-agent:\n    image: nousresearch/hermes-agent:v2026.8.3\n    command: gateway run\n    environment:\n      HERMES_DASHBOARD: '1'\n      HERMES_DASHBOARD_HOST: 0.0.0.0\n      HERMES_DASHBOARD_PORT: '9119'\n      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${SERVICE_USER_HERMESAGENT}\n      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${SERVICE_PASSWORD_HERMESAGENT}\n      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${SERVICE_BASE64_HERMESAGENT}\n      HERMES_HOME: /opt/data\n      GATEWAY_ALLOW_ALL_USERS: 'true'\n      HERMES_REDACT_SECRETS: 'true'\n      HERMES_UID: '1000'\n      HERMES_GID: '1000'\n      HERMES_ENABLE_PROJECT_PLUGINS: ${HERMES_ENABLE_PROJECT_PLUGINS:-true}\n      HERMES_ALLOW_PRIVATE_URLS: ${HERMES_ALLOW_PRIVATE_URLS:-false}\n      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}\n      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}\n      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}\n      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}\n      OPENAI_API_KEY:\
  \ ${OPENAI_API_KEY:-}\n      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}\n    volumes:\n    - hermes-home:/opt/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - test -d /opt/data || exit 1\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '9119'\nvolumes:\n  hermes-home: {}\n"
