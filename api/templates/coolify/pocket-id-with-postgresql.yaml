# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: pocket-id-with-postgresql
name: Pocket Id With Postgresql
category: Security
version: 1
type: compose
accent: '#6B16ED'
description: A simple and secure OIDC provider with passkey authentication
port: 1411
source: coolify
documentation: https://pocket-id.org/docs/setup/installation
compose: "services:\n  pocket-id:\n    image: ghcr.io/pocket-id/pocket-id:v1.13\n    environment:\n      APP_URL: ${SERVICE_URL}\n      TRUST_PROXY: ${TRUST_PROXY:-true}\n      DB_PROVIDER: postgres\n      DB_CONNECTION_STRING: postgresql://${SERVICE_USER_POSTGRESQL}:${SERVICE_PASSWORD_POSTGRESQL}@postgresql:5432/${POSTGRES_DB:-pocketid}\n      ENCRYPTION_KEY: ${SERVICE_PASSWORD_POCKETID}\n      KEYS_STORAGE: ${KEYS_STORAGE:-database}\n      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}\n      SMTP_HOST: ${SMTP_HOST}\n      SMTP_PORT: ${SMTP_PORT:-587}\n      SMTP_FROM: ${SMTP_FROM}\n      SMTP_USER: ${SMTP_USER}\n      SMTP_PASSWORD: ${SMTP_PASSWORD}\n      SMTP_TLS: ${SMTP_TLS:-starttls}\n      SMTP_SKIP_CERT_VERIFY: ${SMTP_SKIP_CERT_VERIFY:-false}\n      EMAIL_LOGIN_NOTIFICATION_ENABLED: ${EMAIL_LOGIN_NOTIFICATION_ENABLED:-false}\n      EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: ${EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED:-false}\n      EMAIL_API_KEY_EXPIRATION_ENABLED: ${EMAIL_API_KEY_EXPIRATION_ENABLED:-false}\n\
  \      PUID: ${PUID:-1000}\n      PGID: ${PGID:-1000}\n    volumes:\n    - pocket-id-data:/app/data\n    healthcheck:\n      test:\n      - CMD\n      - /app/pocket-id\n      - healthcheck\n      interval: 30s\n      timeout: 5s\n      retries: 3\n      start_period: 10s\n    depends_on:\n      postgresql:\n        condition: service_healthy\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '1411'\n  postgresql:\n    image: postgres:16-alpine\n    volumes:\n    - pocket-id-postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRES_DB:-pocketid}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $pocketid\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  pocket-id-data:\
  \ {}\n  pocket-id-postgresql-data: {}\n"
