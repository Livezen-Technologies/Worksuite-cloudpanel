# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: termix
name: Termix
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: All-in-One SSH & Remote Desktop management app.
port: 8080
source: coolify
documentation: https://docs.termix.site/install/server/docker
compose: "services:\n  termix:\n    image: ghcr.io/lukegus/termix:2.6.1\n    environment:\n      PORT: '8080'\n      LOG_LEVEL: ${LOG_LEVEL:-info}\n      GUACD_HOST: guacd\n      GUACD_RECORDING_PATH: /termix-data/session_recordings/guacamole\n    depends_on:\n    - guacd\n    volumes:\n    - termix-data:/app/data\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8080'\n  guacd:\n    image: guacamole/guacd:1.6.0\nvolumes:\n  termix-data: {}\n"
