# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: ente-photos-with-s3
name: Ente Photos With S3
category: Media
version: 1
type: compose
accent: '#6B16ED'
description: Ente Photos is a fully open source, End to End Encrypted alternative to Google Photos and Apple Photos.
port: 8080
source: coolify
documentation: https://help.ente.io/self-hosting/installation/compose
compose: "services:\n  museum:\n    image: ghcr.io/ente-io/server:613c6a96390d7a624cf30b946955705d632423cc\n    environment:\n      ENTE_DB_HOST: postgres\n      ENTE_DB_PORT: '5432'\n      ENTE_DB_NAME: ${POSTGRES_DB:-ente_db}\n      ENTE_DB_USER: ${SERVICE_USER_POSTGRES}\n      ENTE_DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      ENTE_HTTP_USE_TLS: ${ENTE_HTTP_USE_TLS:-false}\n      ENTE_S3_ARE_LOCAL_BUCKETS: 'false'\n      ENTE_S3_USE_PATH_STYLE_URLS: 'true'\n      ENTE_S3_B2_EU_CEN_KEY: ${SERVICE_USER_MINIO}\n      ENTE_S3_B2_EU_CEN_SECRET: ${SERVICE_PASSWORD_MINIO}\n      ENTE_S3_B2_EU_CEN_ENDPOINT: ${SERVICE_FQDN}\n      ENTE_S3_B2_EU_CEN_REGION: eu-central-2\n      ENTE_S3_B2_EU_CEN_BUCKET: b2-eu-cen\n      ENTE_KEY_ENCRYPTION: ${SERVICE_BASE64_ENCRYPTION}\n      ENTE_KEY_HASH: ${SERVICE_BASE64_HASH}\n      ENTE_JWT_SECRET: ${SERVICE_BASE64_JWT}\n      ENTE_INTERNAL_ADMIN: ${ENTE_INTERNAL_ADMIN:-1580559962386438}\n      ENTE_INTERNAL_DISABLE_REGISTRATION: ${ENTE_INTERNAL_DISABLE_REGISTRATION:-false}\n\
  \      ENTE_SMTP_HOST: ${ENTE_SMTP_HOST:-smtp.gmail.com}\n      ENTE_SMTP_PORT: ${ENTE_SMTP_PORT:-587}\n      ENTE_SMTP_USERNAME: ${ENTE_SMTP_USERNAME}\n      ENTE_SMTP_PASSWORD: ${ENTE_SMTP_PASSWORD}\n      ENTE_SMTP_EMAIL: ${ENTE_SMTP_EMAIL}\n      ENTE_SMTP_SENDER_NAME: ${ENTE_SMTP_SENDER_NAME}\n      ENTE_SMTP_ENCRYPTION: ${ENTE_SMTP_ENCRYPTION:-tls}\n    volumes:\n    - museum-data:/data\n    - museum-config:/config\n    depends_on:\n      postgres:\n        condition: service_healthy\n      minio:\n        condition: service_started\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - --spider\n      - http://127.0.0.1:8080/ping\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8080'\n  web:\n    image: ghcr.io/ente-io/web:ca03165f5e7f2a50105e6e40019c17ae6cdd934f\n    environment:\n  \
  \    ENTE_API_ORIGIN: ${SERVICE_URL}\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - --fail\n      - http://localhost:3000\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 10s\n  postgres:\n    image: postgres:15-alpine\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-ente_db}\n    volumes:\n    - postgres-data:/var/lib/postgresql/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB:-ente_db}\n      interval: 10s\n      timeout: 5s\n      retries: 5\n  minio:\n    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z\n    command: server /data --console-address \":9001\"\n    environment:\n      MINIO_SERVER_URL: $MINIO_SERVER_URL\n      MINIO_BROWSER_REDIRECT_URL: $MINIO_BROWSER_REDIRECT_URL\n      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}\n      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}\n\
  \    volumes:\n    - minio-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - mc\n      - ready\n      - local\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  minio-init:\n    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z\n    depends_on:\n      minio:\n        condition: service_started\n    restart: on-failure\n    environment:\n      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}\n      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}\n      MINIO_CORS_URLS: ${SERVICE_URL},${SERVICE_URL}\n    entrypoint: \"/bin/sh -c \\\"\\n  echo \\\\\\\"MINIO_CORS_URLS: \\\\$${MINIO_CORS_URLS}\\\\\\\";\\n  sleep 5;\\n  until mc alias set minio http://minio:9000 \\\\$${MINIO_ROOT_USER} \\\\$${MINIO_ROOT_PASSWORD}; do\\n    echo 'Waiting for MinIO...';\\n    sleep 2;\\n  done;\\n  mc admin config set minio api cors_allow_origin='$MINIO_CORS_URLS' || true;\\n  mc mb minio/b2-eu-cen --ignore-existing;\\n  mc mb minio/wasabi-eu-central-2-v3 --ignore-existing;\\n  mc mb minio/scw-eu-fr-v3\
  \ --ignore-existing;\\n  echo 'MinIO buckets and CORS configured';\\n\\\"\"\nvolumes:\n  museum-data: {}\n  museum-config: {}\n  postgres-data: {}\n  minio-data: {}\n"
