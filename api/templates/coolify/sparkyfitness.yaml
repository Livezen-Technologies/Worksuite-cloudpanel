# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: sparkyfitness
name: Sparkyfitness
category: Personal
version: 1
type: compose
accent: '#6B16ED'
description: SparkyFitness is a comprehensive fitness tracking and management application designed to help users monitor their nutrition, exercise, and body measurements. It provides tools for daily progress tracking, goal setting, and insightful report
port: 80
source: coolify
documentation: https://codewithcj.github.io/SparkyFitness/
compose: "services:\n  sparkyfitness-frontend:\n    image: codewithcj/sparkyfitness:v1.6.1\n    environment:\n      SPARKY_FITNESS_FRONTEND_URL: ${SERVICE_URL}\n      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server\n      SPARKY_FITNESS_SERVER_PORT: '3010'\n    depends_on:\n    - sparkyfitness-server\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  sparkyfitness-server:\n    image: codewithcj/sparkyfitness_server:v1.6.1\n    environment:\n      SPARKY_FITNESS_LOG_LEVEL: ${SPARKY_FITNESS_LOG_LEVEL:-info}\n      NODE_ENV: ${NODE_ENV:-production}\n      TZ: ${TZ:-Etc/UTC}\n      SPARKY_FITNESS_DB_USER: ${SERVICE_USER_POSTGRES}\n      SPARKY_FITNESS_DB_HOST: sparkyfitness-db\n      SPARKY_FITNESS_DB_NAME: ${SPARKY_FITNESS_DB_NAME:-sparkyfitness}\n      SPARKY_FITNESS_DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      SPARKY_FITNESS_DB_PORT: ${SPARKY_FITNESS_DB_PORT:-5432}\n\
  \      SPARKY_FITNESS_APP_DB_USER: ${SPARKY_FITNESS_APP_DB_USER:-sparkyapp}\n      SPARKY_FITNESS_APP_DB_PASSWORD: ${SERVICE_PASSWORD_APPDBPASSWORD}\n      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SERVICE_PASSWORD_SERVERAPIENCRYPTIONKEY}\n      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTHSECRET}\n      SPARKY_FITNESS_FRONTEND_URL: ${SERVICE_URL}\n      ALLOW_PRIVATE_NETWORK_CORS: ${ALLOW_PRIVATE_NETWORK_CORS:-false}\n      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: ${SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS:-}\n      SPARKY_FITNESS_DISABLE_SIGNUP: ${SPARKY_FITNESS_DISABLE_SIGNUP:-false}\n      SPARKY_FITNESS_FORCE_EMAIL_LOGIN: ${SPARKY_FITNESS_FORCE_EMAIL_LOGIN:-true}\n      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_FITNESS_ADMIN_EMAIL:-admin@example.com}\n      SPARKY_FITNESS_EMAIL_HOST: ${SPARKY_FITNESS_EMAIL_HOST:-smtp.gmail.com}\n      SPARKY_FITNESS_EMAIL_PORT: ${SPARKY_FITNESS_EMAIL_PORT:-587}\n      SPARKY_FITNESS_EMAIL_SECURE: ${SPARKY_FITNESS_EMAIL_SECURE:-false}\n      SPARKY_FITNESS_EMAIL_USER:\
  \ ${SPARKY_FITNESS_EMAIL_USER}\n      SPARKY_FITNESS_EMAIL_PASS: ${SPARKY_FITNESS_EMAIL_PASS}\n      SPARKY_FITNESS_EMAIL_FROM: ${SPARKY_FITNESS_EMAIL_FROM:-\"Sparky Fitness <noreply@sparkyfitness.com>\"}\n    depends_on:\n    - sparkyfitness-db\n    volumes:\n    - sparkyfitness-server-backup:/app/SparkyFitnessServer/backup\n    - sparkyfitness-server-uploads:/app/SparkyFitnessServer/uploads\n  sparkyfitness-db:\n    image: postgres:18-alpine\n    environment:\n      POSTGRES_DB: ${SPARKY_FITNESS_DB_NAME:-sparkyfitness}\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_PORT: ${SPARKY_FITNESS_DB_PORT:-5432}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    volumes:\n    - sparkyfitness-db-postgresql:/var/lib/postgresql\nvolumes:\n  sparkyfitness-server-backup: {}\n  sparkyfitness-server-uploads: {}\n\
  \  sparkyfitness-db-postgresql: {}\n"
