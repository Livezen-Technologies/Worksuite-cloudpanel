# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: gitlab
name: Gitlab
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: The all-in-one DevOps platform for seamless collaboration and continuous delivery.
port: 80
source: coolify
documentation: https://docs.gitlab.com/ee/install/docker.html
compose: "services:\n  gitlab:\n    image: gitlab/gitlab-ce:latest\n    environment:\n      TZ: ${TZ:-UTC}\n      GITLAB_TIMEZONE: ${GITLAB_TIMEZONE:-UTC}\n      GITLAB_ROOT_PASSWORD: ${SERVICE_PASSWORD_GITLAB}\n      EXTERNAL_URL: ${SERVICE_URL}\n      GITLAB_HOST: ${SERVICE_URL}\n      GITLAB_SMTP_ENABLE: ${GITLAB_SMTP_ENABLE:-false}\n      GITLAB_SMTP_ADDRESS: $GITLAB_SMTP_ADDRESS\n      GITLAB_SMTP_PORT: ${GITLAB_SMTP_PORT:-587}\n      GITLAB_SMTP_USER_NAME: ${GITLAB_SMTP_USER_NAME}\n      GITLAB_SMTP_PASSWORD: ${GITLAB_SMTP_PASSWORD}\n      GITLAB_SMTP_DOMAIN: ${GITLAB_SMTP_DOMAIN}\n      GITLAB_STARTTLS_AUTO: ${GITLAB_STARTTLS_AUTO:-true}\n      GITLAB_SMTP_TLS: ${GITLAB_SMTP_TLS:-false}\n      GITLAB_EMAIL_FROM: ${GITLAB_EMAIL_FROM}\n      GITLAB_EMAIL_REPLY_TO: $GITLAB_EMAIL_REPLY_TO\n      GITLAB_OMNIBUS_CONFIG: external_url \"${SERVICE_URL}\"; nginx[\"listen_https\"] = false; nginx[\"listen_port\"] = 80; gitlab_rails[\"gitlab_shell_ssh_port\"] = 2222; gitlab_rails[\"smtp_enable\"\
  ] = false; gitlab_rails[\"smtp_address\"] = \"${GITLAB_SMTP_ADDRESS}\"; gitlab_rails[\"smtp_port\"] = 587; gitlab_rails[\"smtp_user_name\"] = \"${GITLAB_SMTP_USER_NAME}\"; gitlab_rails[\"smtp_password\"] = \"${GITLAB_SMTP_PASSWORD}\"; gitlab_rails[\"smtp_domain\"] = \"${GITLAB_SMTP_DOMAIN}\"; gitlab_rails[\"smtp_authentication\"] = \"login\"; gitlab_rails[\"smtp_enable_starttls_auto\"] = true; gitlab_rails[\"smtp_tls\"] = false; gitlab_rails[\"gitlab_email_from\"] = \"${GITLAB_EMAIL_FROM}\"; gitlab_rails[\"gitlab_email_reply_to\"] = \"${GITLAB_EMAIL_REPLY_TO}\";\n    volumes:\n    - gitlab-config:/etc/gitlab\n    - gitlab-logs:/var/log/gitlab\n    - gitlab-data:/var/opt/gitlab\n    shm_size: 256m\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\nvolumes:\n  gitlab-config: {}\n  gitlab-logs: {}\n  gitlab-data: {}\n"
