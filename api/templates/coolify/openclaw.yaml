# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: openclaw
name: Openclaw
category: AI
version: 1
type: compose
accent: '#6B16ED'
description: AI-powered coding assistant with multi-provider support and browser automation.
port: 8080
source: coolify
documentation: https://coolify.io/docs/services/openclaw
compose: "services:\n  openclaw:\n    image: coollabsio/openclaw:2026.2.6\n    environment:\n      AUTH_USERNAME: ${SERVICE_USER_OPENCLAW}\n      AUTH_PASSWORD: ${SERVICE_PASSWORD_OPENCLAW}\n      OPENCLAW_GATEWAY_TOKEN: ${SERVICE_PASSWORD_GATEWAYTOKEN}\n      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}\n      OPENAI_API_KEY: ${OPENAI_API_KEY}\n      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}\n      GEMINI_API_KEY: ${GEMINI_API_KEY}\n      XAI_API_KEY: ${XAI_API_KEY}\n      GROQ_API_KEY: ${GROQ_API_KEY}\n      MISTRAL_API_KEY: ${MISTRAL_API_KEY}\n      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}\n      VENICE_API_KEY: ${VENICE_API_KEY}\n      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}\n      KIMI_API_KEY: ${KIMI_API_KEY}\n      MINIMAX_API_KEY: ${MINIMAX_API_KEY}\n      ZAI_API_KEY: ${ZAI_API_KEY}\n      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}\n      OPENCODE_API_KEY: ${OPENCODE_API_KEY}\n      SYNTHETIC_API_KEY: ${SYNTHETIC_API_KEY}\n      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN}\n      XIAOMI_API_KEY:\
  \ ${XIAOMI_API_KEY}\n      OPENCLAW_PRIMARY_MODEL: ${OPENCLAW_PRIMARY_MODEL}\n      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}\n      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}\n      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}\n      AWS_REGION: ${AWS_REGION:-us-east-1}\n      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}\n      BEDROCK_PROVIDER_FILTER: ${BEDROCK_PROVIDER_FILTER:-anthropic}\n      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}\n      PORT: '8080'\n      OPENCLAW_GATEWAY_PORT: '18789'\n      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-loopback}\n      OPENCLAW_STATE_DIR: /data/.openclaw\n      OPENCLAW_WORKSPACE_DIR: /data/workspace\n      BROWSER_CDP_URL: http://browser:9223\n      BROWSER_DEFAULT_PROFILE: ${BROWSER_DEFAULT_PROFILE:-openclaw}\n      BROWSER_EVALUATE_ENABLED: ${BROWSER_EVALUATE_ENABLED:-true}\n      BROWSER_SNAPSHOT_MODE: ${BROWSER_SNAPSHOT_MODE:-efficient}\n      BROWSER_REMOTE_TIMEOUT_MS: ${BROWSER_REMOTE_TIMEOUT_MS:-1500}\n      BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS:\
  \ ${BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS:-3000}\n      HOOKS_ENABLED: ${HOOKS_ENABLED:-false}\n      HOOKS_PATH: ${HOOKS_PATH:-/hooks}\n      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.moonshot.ai/v1}\n      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/anthropic}\n      TELEGRAM_BOT_TOKEN: $TELEGRAM_BOT_TOKEN\n      DISCORD_BOT_TOKEN: $DISCORD_BOT_TOKEN\n      SLACK_BOT_TOKEN: $SLACK_BOT_TOKEN\n      SLACK_APP_TOKEN: $SLACK_APP_TOKEN\n      WHATSAPP_ENABLED: $WHATSAPP_ENABLED\n      OPENCLAW_DOCKER_APT_PACKAGES: $OPENCLAW_DOCKER_APT_PACKAGES\n    volumes:\n    - openclaw-data:/data\n    depends_on:\n      browser:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -sf\n      - http://127.0.0.1:8080/healthz\n      interval: 10s\n      timeout: 10s\n      retries: 5\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port:\
  \ '8080'\n  browser:\n    image: coollabsio/openclaw-browser:latest\n    environment:\n      PUID: '1000'\n      PGID: '1000'\n      TZ: Etc/UTC\n      CHROME_CLI: --remote-debugging-port=9222\n    volumes:\n    - browser-data:/config\n    shm_size: 2g\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - bash -c ':> /dev/tcp/127.0.0.1/9222' || exit 1\n      interval: 5s\n      timeout: 5s\n      retries: 10\nvolumes:\n  openclaw-data: {}\n  browser-data: {}\n"
