# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: rivet-engine
name: Rivet Engine
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: Build and scale stateful workloads with long-lived processes
port: 6420
source: coolify
documentation: https://www.rivet.dev/docs
compose: "services:\n  rivet-engine:\n    image: rivetdev/engine:2.2.0\n    environment:\n      RIVET__FILE_SYSTEM__PATH: /data\n      RIVET__AUTH__ADMIN_TOKEN: ${SERVICE_BASE64_TOKEN}\n    volumes:\n    - rivet-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:6420/health\n      interval: 2s\n      timeout: 10s\n      retries: 10\n      start_period: 30s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '6420'\nvolumes:\n  rivet-data: {}\n"
