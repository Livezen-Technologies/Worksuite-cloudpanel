# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: teable
name: Teable
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Teable is a powerful visual interface built on relational databases (PostgreSQL).
port: 3000
source: coolify
documentation: https://help.teable.io/
compose: "services:\n  teable:\n    image: ghcr.io/teableio/teable:latest\n    volumes:\n    - teable_data:/app/.assets\n    environment:\n      PUBLIC_ORIGIN: ${SERVICE_URL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      SECRET_KEY: ${SERVICE_PASSWORD_SECRET}\n      TZ: ${TIMEZONE}\n      PRISMA_DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@teable-db:5432/teable\n      NEXT_ENV_IMAGES_ALL_REMOTE: 'true'\n      PORT: '3000'\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n      BACKEND_CACHE_PROVIDER: redis\n      BACKEND_CACHE_REDIS_URI: redis://default:${SERVICE_PASSWORD_REDIS}@teable-cache:6379/0\n      BACKEND_MAIL_HOST: ${BACKEND_MAIL_HOST}\n      BACKEND_MAIL_PORT: ${BACKEND_MAIL_PORT}\n      BACKEND_MAIL_SECURE: ${BACKEND_MAIL_SECURE}\n      BACKEND_MAIL_SENDER: ${BACKEND_MAIL_SENDER}\n      BACKEND_MAIL_SENDER_NAME: ${BACKEND_MAIL_SENDER_NAME}\n      BACKEND_MAIL_AUTH_USER: ${BACKEND_MAIL_AUTH_USER}\n      BACKEND_MAIL_AUTH_PASS:\
  \ ${BACKEND_MAIL_AUTH_PASS}\n    depends_on:\n      teable-cache:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:3000\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  teable-db:\n    image: postgres:15.4\n    volumes:\n    - teable_db_data:/var/lib/postgresql/data\n    environment:\n      TZ: ${TIMEZONE}\n      POSTGRES_DB: ${POSTGRES_DB:-teable}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PORT: ${POSTGRES_PORT:-5432}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $teable\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  teable-db-migrate:\n    image: ghcr.io/teableio/teable-db-migrate:latest\n\
  \    restart: false\n    environment:\n      TZ: ${TIMEZONE}\n      PRISMA_DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@teable-db:5432/teable\n    depends_on:\n      teable-db:\n        condition: service_healthy\n  teable-cache:\n    image: redis:7.2.4\n    environment:\n      REDIS_PORT: '6379'\n      REDIS_DB: '0'\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n    volumes:\n    - teable_cache_data:/data\n    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - --raw\n      - incr\n      - ping\n      interval: 10s\n      timeout: 3s\n      retries: 3\nvolumes:\n  teable_data: {}\n  teable_db_data: {}\n  teable_cache_data: {}\n"
