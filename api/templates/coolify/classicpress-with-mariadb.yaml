# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: classicpress-with-mariadb
name: Classicpress With Mariadb
category: CMS
version: 1
type: compose
accent: '#6B16ED'
description: A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg).
port: 80
source: coolify
documentation: https://www.classicpress.net/
compose: "services:\n  classicpress:\n    image: classicpress/classicpress:latest\n    volumes:\n    - classicpress-files:/var/www/html\n    environment:\n      CLASSICPRESS_DB_HOST: mariadb\n      CLASSICPRESS_DB_USER: ${SERVICE_USER_CLASSICPRESS}\n      CLASSICPRESS_DB_PASSWORD: ${SERVICE_PASSWORD_CLASSICPRESS}\n      CLASSICPRESS_DB_NAME: classicpress\n    depends_on:\n    - mariadb\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1\n      interval: 2s\n      timeout: 10s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  mariadb:\n    image: mariadb:11\n    volumes:\n    - mariadb-data:/var/lib/mysql\n    environment:\n      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT}\n      MYSQL_DATABASE: classicpress\n      MYSQL_USER: ${SERVICE_USER_CLASSICPRESS}\n      MYSQL_PASSWORD: ${SERVICE_PASSWORD_CLASSICPRESS}\n\
  \    healthcheck:\n      test:\n      - CMD\n      - healthcheck.sh\n      - --connect\n      - --innodb_initialized\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  classicpress-files: {}\n  mariadb-data: {}\n"
