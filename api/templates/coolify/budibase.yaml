# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: budibase
name: Budibase
category: Automation
version: 1
type: compose
accent: '#6B16ED'
description: Low code platform for building business apps and workflows in minutes. Supports PostgreSQL, MySQL, MSSQL, MongoDB, Rest API, Docker, K8s, and more.
port: 10000
source: coolify
documentation: https://docs.budibase.com/docs/docker-compose
compose: "services:\n  app-service:\n    image: budibase.docker.scarf.sh/budibase/apps\n    environment:\n      SELF_HOSTED: '1'\n      COUCH_DB_URL: http://${SERVICE_USER_COUCHDB}:${SERVICE_PASSWORD_COUCHDB}@couchdb-service:5984\n      WORKER_URL: http://worker-service:4003\n      MINIO_URL: http://minio-service:9000\n      MINIO_ACCESS_KEY: ${SERVICE_USER_MINIO}\n      MINIO_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}\n      INTERNAL_API_KEY: ${SERVICE_BASE64_BUDIBASE}\n      BUDIBASE_ENVIRONMENT: ${BUDIBASE_ENVIRONMENT:-PRODUCTION}\n      PORT: '4002'\n      API_ENCRYPTION_KEY: ${SERVICE_BASE64_BUDIBASEAPI}\n      ENCRYPTION_KEY: ${SERVICE_BASE64_BUDIBASE}\n      JWT_SECRET: ${SERVICE_BASE64_BUDIBASEJWT}\n      LOG_LEVEL: info\n      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}\n      REDIS_URL: redis-service:6379\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n      BB_ADMIN_USER_EMAIL: ''\n      BB_ADMIN_USER_PASSWORD: ''\n    depends_on:\n    - worker-service\n    - redis-service\n    healthcheck:\n\
  \      test:\n      - CMD\n      - wget\n      - --spider\n      - -qO-\n      - http://localhost:4002/health\n      interval: 15s\n      timeout: 15s\n      retries: 5\n      start_period: 10s\n  worker-service:\n    image: budibase.docker.scarf.sh/budibase/worker\n    environment:\n      SELF_HOSTED: '1'\n      PORT: '4003'\n      CLUSTER_PORT: '10000'\n      API_ENCRYPTION_KEY: ${SERVICE_BASE64_BUDIBASEAPI}\n      JWT_SECRET: ${SERVICE_BASE64_BUDIBASEJWT}\n      MINIO_ACCESS_KEY: ${SERVICE_USER_MINIO}\n      MINIO_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}\n      MINIO_URL: http://minio-service:9000\n      APPS_URL: http://app-service:4002\n      COUCH_DB_USERNAME: ${SERVICE_USER_COUCHDB}\n      COUCH_DB_PASSWORD: ${SERVICE_PASSWORD_COUCHDB}\n      COUCH_DB_URL: http://${SERVICE_USER_COUCHDB}:${SERVICE_PASSWORD_COUCHDB}@couchdb-service:5984\n      INTERNAL_API_KEY: ${SERVICE_BASE64_BUDIBASE}\n      REDIS_URL: redis-service:6379\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n    depends_on:\n\
  \    - redis-service\n    - minio-service\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - --spider\n      - -qO-\n      - http://localhost:4003/health\n      interval: 15s\n      timeout: 15s\n      retries: 5\n      start_period: 10s\n  minio-service:\n    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z\n    volumes:\n    - minio_data:/data\n    environment:\n      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}\n      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}\n      MINIO_BROWSER: 'off'\n    command: server /data --console-address \":9001\"\n    healthcheck:\n      test:\n      - CMD\n      - mc\n      - ready\n      - local\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  proxy-service:\n    image: budibase/proxy\n    environment:\n      PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND: '10'\n      PROXY_RATE_LIMIT_API_PER_SECOND: '20'\n      APPS_UPSTREAM_URL: http://app-service:4002\n      WORKER_UPSTREAM_URL: http://worker-service:4003\n      MINIO_UPSTREAM_URL: http://minio-service:9000\n\
  \      COUCHDB_UPSTREAM_URL: http://couchdb-service:5984\n      RESOLVER: 127.0.0.11\n    depends_on:\n    - minio-service\n    - worker-service\n    - app-service\n    - couchdb-service\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://localhost:10000/\n      interval: 15s\n      timeout: 15s\n      retries: 5\n      start_period: 10s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '10000'\n  couchdb-service:\n    image: budibase/database\n    environment:\n      COUCHDB_PASSWORD: ${SERVICE_PASSWORD_COUCHDB}\n      COUCHDB_USER: ${SERVICE_USER_COUCHDB}\n      TARGETBUILD: docker-compose\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://localhost:5984/\n      interval: 15s\n      timeout: 15s\n      retries: 5\n      start_period: 10s\n    volumes:\n    - couchdb3_data:/data\n  redis-service:\n\
  \    image: redis\n    command: redis-server --requirepass \"${SERVICE_PASSWORD_REDIS}\"\n    volumes:\n    - redis_data:/data\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - -a\n      - ${SERVICE_PASSWORD_REDIS}\n      - ping\n      interval: 15s\n      timeout: 15s\n      retries: 5\n      start_period: 10s\nvolumes:\n  minio_data: {}\n  couchdb3_data: {}\n  redis_data: {}\n"
