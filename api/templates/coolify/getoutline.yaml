# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: getoutline
name: Getoutline
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Your team’s knowledge base
port: 3000
source: coolify
documentation: https://docs.getoutline.com/s/hosting/doc/hosting-outline-nipGaCRBDu
compose: "services:\n  outline:\n    image: docker.getoutline.com/outlinewiki/outline:latest\n    volumes:\n    - storage-data:/var/lib/outline/data\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    environment:\n      NODE_ENV: production\n      SECRET_KEY: ${SERVICE_HEX_OUTLINE}\n      UTILS_SECRET: ${SERVICE_PASSWORD_OUTLINE}\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-outline}\n      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379\n      URL: ${SERVICE_URL}\n      PORT: ${OUTLINE_PORT:-3000}\n      FILE_STORAGE: ${FILE_STORAGE:-local}\n      FILE_STORAGE_LOCAL_ROOT_DIR: ${FILE_STORAGE_LOCAL_ROOT_DIR:-/var/lib/outline/data}\n      FILE_STORAGE_UPLOAD_MAX_SIZE: ${FILE_STORAGE_UPLOAD_MAX_SIZE:-2000}\n      FILE_STORAGE_IMPORT_MAX_SIZE: ${FILE_STORAGE_IMPORT_MAX_SIZE:-100}\n      FILE_STORAGE_WORKSPACE_IMPORT_MAX_SIZE: ${FILE_STORAGE_WORKSPACE_IMPORT_MAX_SIZE}\n\
  \      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}\n      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}\n      AWS_REGION: ${AWS_REGION}\n      AWS_S3_ACCELERATE_URL: ${AWS_S3_ACCELERATE_URL}\n      AWS_S3_UPLOAD_BUCKET_URL: ${AWS_S3_UPLOAD_BUCKET_URL}\n      AWS_S3_UPLOAD_BUCKET_NAME: ${AWS_S3_UPLOAD_BUCKET_NAME}\n      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}\n      AWS_S3_ACL: ${AWS_S3_ACL:-private}\n      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}\n      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}\n      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}\n      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}\n      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}\n      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}\n      AZURE_RESOURCE_APP_ID: ${AZURE_RESOURCE_APP_ID}\n      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}\n      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}\n      OIDC_AUTH_URI: ${OIDC_AUTH_URI}\n      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI}\n      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI}\n      OIDC_LOGOUT_URI:\
  \ ${OIDC_LOGOUT_URI}\n      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM}\n      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME}\n      OIDC_SCOPES: ${OIDC_SCOPES}\n      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}\n      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}\n      GITHUB_APP_NAME: ${GITHUB_APP_NAME}\n      GITHUB_APP_ID: ${GITHUB_APP_ID}\n      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}\n      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}\n      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}\n      DISCORD_SERVER_ID: ${DISCORD_SERVER_ID}\n      DISCORD_SERVER_ROLES: ${DISCORD_SERVER_ROLES}\n      PGSSLMODE: ${PGSSLMODE:-disable}\n      FORCE_HTTPS: ${FORCE_HTTPS:-true}\n      SMTP_HOST: ${SMTP_HOST}\n      SMTP_PORT: ${SMTP_PORT}\n      SMTP_USERNAME: ${SMTP_USERNAME}\n      SMTP_PASSWORD: ${SMTP_PASSWORD}\n      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}\n      SMTP_REPLY_EMAIL: ${SMTP_REPLY_EMAIL}\n      SMTP_TLS_CIPHERS: ${SMTP_TLS_CIPHERS}\n      SMTP_SECURE: ${SMTP_SECURE}\n      SMTP_NAME:\
  \ ${SMTP_NAME}\n    healthcheck:\n      disable: true\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  redis:\n    image: redis:alpine\n    environment:\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n    command:\n    - redis-server\n    - --requirepass\n    - ${SERVICE_PASSWORD_REDIS}\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - -a\n      - ${SERVICE_PASSWORD_REDIS}\n      - PING\n      interval: 10s\n      timeout: 30s\n      retries: 3\n  postgres:\n    image: postgres:12-alpine\n    volumes:\n    - database-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DATABASE:-outline}\n    healthcheck:\n      test:\n      - CMD\n      - pg_isready\n      - -U\n      - ${SERVICE_USER_POSTGRES}\n      -\
  \ -d\n      - ${POSTGRES_DATABASE:-outline}\n      interval: 30s\n      timeout: 20s\n      retries: 3\nvolumes:\n  storage-data: {}\n  database-data: {}\n"
