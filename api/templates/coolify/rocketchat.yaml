# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: rocketchat
name: Rocketchat
category: Messaging
version: 1
type: compose
accent: '#6B16ED'
description: Self-hosted, secure and highly customizable open-source communication platform for organizations with sophisticated security and privacy concerns.
port: 3000
source: coolify
documentation: https://github.com/RocketChat/Rocket.Chat
compose: "services:\n  rocketchat:\n    image: registry.rocket.chat/rocketchat/rocket.chat:8.0.1\n    environment:\n      MONGO_URL: mongodb://${MONGODB_ADVERTISED_HOSTNAME:-mongodb}:${MONGODB_INITIAL_PRIMARY_PORT_NUMBER:-27017}/${MONGODB_DATABASE:-rocketchat}?replicaSet=${MONGODB_REPLICA_SET_NAME:-rs0}\n      MONGO_OPLOG_URL: mongodb://${MONGODB_ADVERTISED_HOSTNAME:-mongodb}:${MONGODB_INITIAL_PRIMARY_PORT_NUMBER:-27017}/local?replicaSet=${MONGODB_REPLICA_SET_NAME:-rs0}\n      ROOT_URL: ${SERVICE_URL}\n      DEPLOY_METHOD: docker\n      REG_TOKEN: $REG_TOKEN\n      MAIL_URL: ${MAIL_URL:-test@example.com}\n    depends_on:\n      mongodb:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - node\n      - --eval\n      - 'const http = require(''http''); const options = { host: ''0.0.0.0'', port: 3000, timeout: 2000, path: ''/health'' }; const healthCheck = http.request(options, (res) => { console.log(''HEALTHCHECK STATUS:'', res.statusCode); if (res.statusCode\
  \ == 200) { process.exit(0); } else { process.exit(1); } }); healthCheck.on(''error'', function (err) { console.error(''ERROR''); process.exit(1); }); healthCheck.end();'\n      interval: 2s\n      timeout: 10s\n      retries: 15\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  mongodb:\n    image: mongo:7\n    volumes:\n    - mongodb_data:/data/db\n    command: \"sh -c \\\"\\n  mongod --replSet ${MONGODB_REPLICA_SET_NAME:-rs0} --bind_ip_all &\\n  sleep 5 &&\\n  mongosh --eval 'rs.initiate({_id:\\\\\\\"${MONGODB_REPLICA_SET_NAME:-rs0}\\\\\\\", members:[{_id:0, host:\\\\\\\"mongodb:27017\\\\\\\"}]})' ||\\n  true &&\\n  wait\\n\\\"\\n\"\n    healthcheck:\n      test:\n      - CMD\n      - mongosh\n      - --quiet\n      - --eval\n      - db.adminCommand('ping')\n      interval: 2s\n      timeout: 10s\n      retries: 15\nvolumes:\n  mongodb_data: {}\n"
