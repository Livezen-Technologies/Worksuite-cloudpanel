compose: "services:\n  proxy:\n    image: makeplane/plane-proxy:${APP_RELEASE:-v1.3.0}\n    environment:\n      APP_DOMAIN: ${SERVICE_URL}\n      SITE_ADDRESS: :80\n      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}\n      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}\n    volumes:\n    - proxy_config:/config\n    - proxy_data:/data\n    depends_on:\n    - web\n    - api\n    - space\n    - admin\n    - live\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:80\n      interval: 2s\n      timeout: 10s\n      retries: 15\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  web:\n    image: makeplane/plane-frontend:${APP_RELEASE:-v1.3.0}\n    depends_on:\n    - api\n    - worker\n    healthcheck:\n      test: wget -qO- http://`hostname`:3000\n      interval: 2s\n      timeout: 10s\n      retries: 15\n  space:\n    image:\
