# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: emby
name: Emby
category: Media
version: 1
type: compose
accent: '#6B16ED'
description: A media server software that allows you to organize, stream, and access your multimedia content effortlessly.
port: 8096
source: coolify
documentation: https://emby.media/support/articles/Home.html
compose: "services:\n  emby:\n    image: lscr.io/linuxserver/emby:latest\n    environment:\n      PUID: '1000'\n      PGID: '1000'\n      TZ: Europe/Madrid\n    volumes:\n    - emby-config:/config\n    - emby-tvshows:/tvshows\n    - emby-movies:/movies\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:8096\n      interval: 2s\n      timeout: 10s\n      retries: 15\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8096'\nvolumes:\n  emby-config: {}\n  emby-tvshows: {}\n  emby-movies: {}\n"
