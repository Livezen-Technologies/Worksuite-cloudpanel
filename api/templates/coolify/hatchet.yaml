# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: hatchet
name: Hatchet
category: Automation
version: 1
type: compose
accent: '#6B16ED'
description: Hatchet allows you to run background tasks at scale with a high-throughput, low-latency computing service built on an open-source, fault-tolerant queue.
port: 80
source: coolify
documentation: https://docs.hatchet.run/self-hosting/docker-compose
compose: "services:\n  hatchet-dashboard:\n    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:latest\n    command: sh ./entrypoint.sh --config /hatchet/config\n    environment:\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-hatchet}\n      SERVER_AUTH_SET_EMAIL_VERIFIED: ${SERVER_AUTH_SET_EMAIL_VERIFIED:-true}\n    depends_on:\n      postgres:\n        condition: service_healthy\n      rabbitmq:\n        condition: service_healthy\n      setup-config:\n        condition: service_completed_successfully\n      migration:\n        condition: service_completed_successfully\n    volumes:\n    - hatchet-certs:/hatchet/certs\n    - hatchet-config:/hatchet/config\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  hatchet-engine:\n    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:latest\n  \
  \  command: /hatchet/hatchet-engine --config /hatchet/config\n    restart: on-failure\n    depends_on:\n      postgres:\n        condition: service_healthy\n      rabbitmq:\n        condition: service_healthy\n      setup-config:\n        condition: service_completed_successfully\n      migration:\n        condition: service_completed_successfully\n    environment:\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-hatchet}\n      SERVER_GRPC_BIND_ADDRESS: ${SERVER_GRPC_BIND_ADDRESS:-0.0.0.0}\n      SERVER_GRPC_INSECURE: ${SERVER_GRPC_INSECURE:-t}\n    volumes:\n    - hatchet-certs:/hatchet/certs\n    - hatchet-config:/hatchet/config\n  postgres:\n    image: postgres:16-alpine\n    volumes:\n    - postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-hatchet}\n    healthcheck:\n    \
  \  test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $hatchet\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  rabbitmq:\n    image: rabbitmq:3-management\n    hostname: rabbitmq\n    environment:\n      RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ}\n      RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ}\n      PORT: ${RABBITMQ_PORT:-5672}\n    healthcheck:\n      test: rabbitmq-diagnostics -q check_port_connectivity\n      interval: 5s\n      timeout: 30s\n      retries: 20\n      start_period: 60s\n    volumes:\n    - rabbitmq-data:/var/lib/rabbitmq/\n  migration:\n    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:latest\n    command: /hatchet/hatchet-migrate\n    restart: false\n    environment:\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-hatchet}\n    depends_on:\n      postgres:\n        condition: service_healthy\n  setup-config:\n    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:latest\n\
  \    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false\n    restart: false\n    environment:\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-hatchet}\n      SERVER_TASKQUEUE_RABBITMQ_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@rabbitmq:5672/\n      SERVER_AUTH_COOKIE_DOMAIN: ${SERVER_AUTH_COOKIE_DOMAIN:-localhost:8080}\n      SERVER_AUTH_COOKIE_INSECURE: ${SERVER_AUTH_COOKIE_INSECURE:-t}\n      SERVER_GRPC_BIND_ADDRESS: ${SERVER_GRPC_BIND_ADDRESS:-0.0.0.0}\n      SERVER_GRPC_INSECURE: ${SERVER_GRPC_INSECURE:-t}\n      SERVER_GRPC_BROADCAST_ADDRESS: ${SERVER_GRPC_BROADCAST_ADDRESS:-localhost:7077}\n      SERVER_DEFAULT_ENGINE_VERSION: V1\n      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: ${SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS:-hatchet-engine:7077}\n    volumes:\n    - hatchet-certs:/hatchet/certs\n    - hatchet-config:/hatchet/config\n\
  \    depends_on:\n      migration:\n        condition: service_completed_successfully\n      rabbitmq:\n        condition: service_healthy\n      postgres:\n        condition: service_healthy\nvolumes:\n  hatchet-certs: {}\n  hatchet-config: {}\n  postgresql-data: {}\n  rabbitmq-data: {}\n"
