# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: sonarr
name: Sonarr
category: Media
version: 1
type: compose
accent: '#6B16ED'
description: Sonarr⁠ (formerly NZBdrone) is a PVR for usenet and bittorrent users. It can monitor multiple RSS feeds for new episodes of your favorite shows and will grab, sort and rename them. It can also be configured to automatically upgrade the qual
port: 8989
source: coolify
documentation: https://hub.docker.com/r/linuxserver/sonarr
compose: "services:\n  sonarr:\n    image: lscr.io/linuxserver/sonarr:latest\n    environment:\n      _APP_URL: ${SERVICE_URL}\n      PUID: '1000'\n      PGID: '1000'\n      TZ: ${TZ:-America/Toronto}\n    volumes:\n    - sonarr-config:/config\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://localhost:8989/ping\n      interval: 2s\n      timeout: 10s\n      retries: 15\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8989'\nvolumes:\n  sonarr-config: {}\n"
