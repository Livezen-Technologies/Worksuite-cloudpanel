# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: onetimesecret
name: Onetimesecret
category: Security
version: 1
type: compose
accent: '#6B16ED'
description: Share sensitive information securely with self-destructing links that are only viewable once.
port: 3000
source: coolify
documentation: https://docs.onetimesecret.com
compose: "services:\n  onetimesecret:\n    image: onetimesecret/onetimesecret:latest\n    environment:\n      AUTH_AUTOVERIFY: ${AUTH_AUTOVERIFY:-true}\n      AUTH_SIGNUP: ${AUTH_SIGNUP:-true}\n      COLONEL: ${COLONEL:-admin@example.com}\n      HOST: ${HOST:-localhost}\n      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0\n      SECRET: ${SERVICE_PASSWORD_ONETIMESECRET}\n      SSL: ${SSL:-false}\n      RACK_ENV: production\n    depends_on:\n      redis:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - ruby\n      - -rnet/http\n      - -e\n      - 'exit(Net::HTTP.get_response(URI(''http://localhost:3000'')).is_a?(Net::HTTPSuccess) ? 0 : 1)'\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  redis:\n    image: redis:8-alpine\n    command: redis-server\
  \ --requirepass ${SERVICE_PASSWORD_REDIS}\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - ping\n      interval: 30s\n      timeout: 10s\n      retries: 3\n"
