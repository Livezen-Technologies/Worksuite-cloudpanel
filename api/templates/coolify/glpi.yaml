# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: glpi
name: Glpi
category: Business
version: 1
type: compose
accent: '#6B16ED'
description: GLPI (Gestionnaire Libre de Parc Informatique) is a free, open-source IT Service Management (ITSM) platform used for IT asset management, helpdesk, and service desk operations.
port: 80
source: coolify
documentation: https://help.glpi-project.org/documentation
compose: "services:\n  glpi:\n    image: glpi/glpi:11\n    environment:\n      GLPI_DB_HOST: glpi-db\n      GLPI_DB_PORT: '3306'\n      GLPI_DB_NAME: ${MYSQL_DATABASE:-glpi-db}\n      GLPI_DB_USER: ${SERVICE_USER_MYSQL}\n      GLPI_DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n    volumes:\n    - glpi-data:/var/glpi\n    depends_on:\n      glpi-db:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://localhost/\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  glpi-db:\n    image: mysql:8\n    volumes:\n    - mysql-data:/var/lib/mysql\n    environment:\n      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT}\n      MYSQL_DATABASE: ${MYSQL_DATABASE:-glpi-db}\n      MYSQL_USER: ${SERVICE_USER_MYSQL}\n      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n\
  \    healthcheck:\n      test:\n      - CMD\n      - mysqladmin\n      - ping\n      - -h\n      - 127.0.0.1\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  glpi-data: {}\n  mysql-data: {}\n"
