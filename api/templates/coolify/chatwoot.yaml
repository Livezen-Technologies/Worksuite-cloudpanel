# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: chatwoot
name: Chatwoot
category: Business
version: 1
type: compose
accent: '#6B16ED'
description: Delightful customer relationships at scale.
port: 3000
source: coolify
documentation: https://www.chatwoot.com/docs/self-hosted/
compose: "services:\n  chatwoot:\n    image: chatwoot/chatwoot:latest\n    depends_on:\n    - postgres\n    - redis\n    environment:\n      SECRET_KEY_BASE: ${SERVICE_PASSWORD_CHATWOOT}\n      FRONTEND_URL: ${SERVICE_URL}\n      DEFAULT_LOCALE: ${CHATWOOT_DEFAULT_LOCALE}\n      FORCE_SSL: ${FORCE_SSL:-false}\n      ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}\n      REDIS_URL: redis://default@redis:6379\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n      REDIS_OPENSSL_VERIFY_MODE: ${REDIS_OPENSSL_VERIFY_MODE:-none}\n      POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot}\n      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}\n      POSTGRES_USERNAME: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}\n      NODE_ENV: ${NODE_ENV:-production}\n      RAILS_ENV: ${RAILS_ENV:-production}\n      INSTALLATION_ENV: ${INSTALLATION_ENV:-docker}\n      MAILER_SENDER_EMAIL: ${CHATWOOT_MAILER_SENDER_EMAIL}\n      SMTP_ADDRESS:\
  \ ${CHATWOOT_SMTP_ADDRESS}\n      SMTP_AUTHENTICATION: ${CHATWOOT_SMTP_AUTHENTICATION}\n      SMTP_DOMAIN: ${CHATWOOT_SMTP_DOMAIN}\n      SMTP_ENABLE_STARTTLS_AUTO: ${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}\n      SMTP_PORT: ${CHATWOOT_SMTP_PORT}\n      SMTP_USERNAME: ${CHATWOOT_SMTP_USERNAME}\n      SMTP_PASSWORD: ${CHATWOOT_SMTP_PASSWORD}\n      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}\n      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: ${SAFE_FETCH_ALLOW_PRIVATE_NETWORK:-false}\n    entrypoint: docker/entrypoints/rails.sh\n    command: sh -c \"bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0\"\n    volumes:\n    - rails-data:/app/storage\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - --spider\n      - -q\n      - http://127.0.0.1:3000\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port:\
  \ '3000'\n  sidekiq:\n    image: chatwoot/chatwoot:latest\n    depends_on:\n    - postgres\n    - redis\n    environment:\n      SECRET_KEY_BASE: ${SERVICE_PASSWORD_CHATWOOT}\n      FRONTEND_URL: ${SERVICE_URL}\n      DEFAULT_LOCALE: ${CHATWOOT_DEFAULT_LOCALE}\n      FORCE_SSL: ${FORCE_SSL:-false}\n      ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}\n      REDIS_URL: redis://default@redis:6379\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n      REDIS_OPENSSL_VERIFY_MODE: ${REDIS_OPENSSL_VERIFY_MODE:-none}\n      POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot}\n      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}\n      POSTGRES_USERNAME: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}\n      NODE_ENV: ${NODE_ENV:-production}\n      RAILS_ENV: ${RAILS_ENV:-production}\n      INSTALLATION_ENV: ${INSTALLATION_ENV:-docker}\n      MAILER_SENDER_EMAIL: ${CHATWOOT_MAILER_SENDER_EMAIL}\n      SMTP_ADDRESS: ${CHATWOOT_SMTP_ADDRESS}\n\
  \      SMTP_AUTHENTICATION: ${CHATWOOT_SMTP_AUTHENTICATION}\n      SMTP_DOMAIN: ${CHATWOOT_SMTP_DOMAIN}\n      SMTP_ENABLE_STARTTLS_AUTO: ${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}\n      SMTP_PORT: ${CHATWOOT_SMTP_PORT}\n      SMTP_USERNAME: ${CHATWOOT_SMTP_USERNAME}\n      SMTP_PASSWORD: ${CHATWOOT_SMTP_PASSWORD}\n      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}\n    command:\n    - bundle\n    - exec\n    - sidekiq\n    - -C\n    - config/sidekiq.yml\n    volumes:\n    - rails-data:/app/storage\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - bundle exec sidekiqmon processes | grep -q 'sidekiq'\n      interval: 30s\n      timeout: 10s\n      retries: 3\n  postgres:\n    image: pgvector/pgvector:pg12\n    restart: always\n    volumes:\n    - postgres-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_DB: ${POSTGRES_DB:-chatwoot}\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n    healthcheck:\n   \
  \   test:\n      - CMD-SHELL\n      - pg_isready -U ${SERVICE_USER_POSTGRES} -d chatwoot -h 127.0.0.1\n      interval: 30s\n      timeout: 10s\n      retries: 5\n  redis:\n    image: redis:alpine\n    restart: always\n    command:\n    - sh\n    - -c\n    - redis-server --requirepass \"${SERVICE_PASSWORD_REDIS}\"\n    volumes:\n    - redis-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - -a\n      - ${SERVICE_PASSWORD_REDIS}\n      - PING\n      interval: 30s\n      timeout: 10s\n      retries: 5\nvolumes:\n  rails-data: {}\n  postgres-data: {}\n  redis-data: {}\n"
