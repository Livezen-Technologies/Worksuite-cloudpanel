# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: yamtrack
name: Yamtrack
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Yamtrack is a self hosted media tracker for movies, tv shows, anime, manga, video games and books.
port: 8000
source: coolify
documentation: https://github.com/FuzzyGrim/Yamtrack/wiki
compose: "services:\n  yamtrack:\n    image: ghcr.io/fuzzygrim/yamtrack\n    environment:\n      URLS: ${SERVICE_URL}\n      TZ: ${TZ:-Europe/Berlin}\n      SECRET: ${SERVICE_PASSWORD_SECRET}\n      REGISTRATION: ${REGISTRATION_ENABLED:-true}\n      REDIS_URL: redis://redis:6379\n    volumes:\n    - yamtrack_data:/yamtrack/db\n    depends_on:\n      redis:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - wget --quiet --tries=1 --spider http://127.0.0.1:8000/health/ || exit 1\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8000'\n  redis:\n    image: redis:7-alpine\n    volumes:\n    - yamtrack_redis_data:/data\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - ping\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  yamtrack_data:\
  \ {}\n  yamtrack_redis_data: {}\n"
