# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: seafile
name: Seafile
category: Storage
version: 1
type: compose
accent: '#6B16ED'
description: Open source cloud storage system for file sync, share and document collaboration
port: 80
source: coolify
documentation: https://manual.seafile.com
compose: "services:\n  seafile:\n    image: seafileltd/seafile-mc:12.0-latest\n    volumes:\n    - seafile-data:/shared\n    environment:\n      SEAFILE_SERVER_HOSTNAME: ${SERVICE_FQDN}\n      DB_HOST: mariadb\n      DB_PORT: '3306'\n      DB_ROOT_PASSWD: ${SERVICE_PASSWORD_MYSQLROOT}\n      DB_USER: ${SERVICE_USER_MYSQL}\n      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}\n      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: ${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}\n      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: ${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}\n      TIME_ZONE: ${TIME_ZONE:-UTC}\n      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL:-test@example.com}\n      INIT_SEAFILE_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}\n      SEAFILE_SERVER_PROTOCOL: https\n      SITE_ROOT: ${SITE_ROOT:-/}\n      NON_ROOT: ${NON_ROOT:-false}\n      JWT_PRIVATE_KEY: ${SERVICE_PASSWORD_JWT}\n      SEAFILE_LOG_TO_STDOUT: ${SEAFILE_LOG_TO_STDOUT:-true}\n\
  \      FILE_SERVER_ROOT: ${SERVICE_URL}/seafhttp\n      ENABLE_SEADOC: ${ENABLE_SEADOC:-true}\n      SEADOC_SERVER_URL: ${SERVICE_URL}\n    depends_on:\n      mariadb:\n        condition: service_healthy\n      memcached:\n        condition: service_started\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:80/api2/ping\n      interval: 10s\n      timeout: 20s\n      retries: 5\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '80'\n  seadoc:\n    image: seafileltd/sdoc-server:1.0-latest\n    volumes:\n    - seadoc-data:/shared\n    environment:\n      DB_HOST: mariadb\n      DB_PORT: '3306'\n      DB_USER: ${SERVICE_USER_MYSQL}\n      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n      DB_NAME: ${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}\n      TIME_ZONE: ${TIME_ZONE:-UTC}\n      JWT_PRIVATE_KEY: ${SERVICE_PASSWORD_JWT}\n\
  \      NON_ROOT: ${NON_ROOT:-false}\n      SEAHUB_SERVICE_URL: http://seafile\n    depends_on:\n      mariadb:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:80/ping\n      interval: 10s\n      timeout: 20s\n      retries: 5\n  mariadb:\n    image: mariadb:11\n    volumes:\n    - seafile_mariadb_data:/var/lib/mysql\n    environment:\n      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}\n      MYSQL_USER: ${SERVICE_USER_MYSQL}\n      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n      MYSQL_DATABASE: ${MYSQL_DATABASE:-seafile-db}\n    healthcheck:\n      test:\n      - CMD\n      - healthcheck.sh\n      - --connect\n      - --innodb_initialized\n      interval: 10s\n      timeout: 20s\n      retries: 5\n  memcached:\n    image: memcached:latest\n    entrypoint: memcached -m 256\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - bash -c \"echo version | (exec 3<>/dev/tcp/localhost/11211; cat >&3;\
  \ timeout 0.5 cat <&3; exec 3<&-)\"\n      interval: 10s\n      timeout: 20s\n      retries: 5\nvolumes:\n  seafile-data: {}\n  seadoc-data: {}\n  seafile_mariadb_data: {}\n"
