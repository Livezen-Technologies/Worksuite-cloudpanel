# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: penpot-with-s3
name: Penpot With S3
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Penpot is the first Open Source design and prototyping platform for product teams.
port: 8080
source: coolify
documentation: https://help.penpot.app/technical-guide/getting-started/#install-with-docker
compose: "services:\n  frontend:\n    image: penpotapp/frontend:2.11.1\n    depends_on:\n      penpot-backend:\n        condition: service_healthy\n      penpot-exporter:\n        condition: service_healthy\n    environment:\n      PENPOT_FLAGS: ${PENPOT_BACKEND_FLAGS:-enable-login-with-password}\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:8080\n      interval: 2s\n      timeout: 10s\n      retries: 15\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8080'\n  penpot-backend:\n    image: penpotapp/backend:2.11.1\n    depends_on:\n      postgres:\n        condition: service_healthy\n      penpot-valkey:\n        condition: service_healthy\n      minio-init:\n        condition: service_completed_successfully\n    environment:\n      PENPOT_FLAGS: ${PENPOT_BACKEND_FLAGS:-enable-login-with-password}\n      PENPOT_HTTP_SERVER_PORT:\
  \ '6060'\n      PENPOT_SECRET_KEY: ${SERVICE_BASE64_PENPOT}\n      PENPOT_PUBLIC_URI: ${SERVICE_URL}\n      PENPOT_BACKEND_URI: http://penpot-backend\n      PENPOT_EXPORTER_URI: http://penpot-exporter\n      PENPOT_DATABASE_URI: postgresql://postgres/${POSTGRES_DB:-penpot}\n      PENPOT_DATABASE_USERNAME: ${SERVICE_USER_POSTGRES}\n      PENPOT_DATABASE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      PENPOT_REDIS_URI: redis://penpot-valkey/0\n      PENPOT_TELEMETRY_ENABLED: ${PENPOT_TELEMETRY_ENABLED:-false}\n      PENPOT_OBJECTS_STORAGE_BACKEND: s3\n      PENPOT_OBJECTS_STORAGE_S3_REGION: us-east-1\n      PENPOT_OBJECTS_STORAGE_S3_BUCKET: penpot\n      PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: http://minio:9000\n      AWS_ACCESS_KEY_ID: ${SERVICE_USER_MINIO}\n      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}\n      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}\n      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}\n      PENPOT_SMTP_HOST:\
  \ ${PENPOT_SMTP_HOST:-mailpit}\n      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT:-1025}\n      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME:-penpot}\n      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD:-penpot}\n      PENPOT_SMTP_TLS: ${PENPOT_SMTP_TLS:-false}\n      PENPOT_SMTP_SSL: ${PENPOT_SMTP_SSL:-false}\n    healthcheck:\n      test:\n      - CMD\n      - node\n      - -e\n      - 'require(''http'').get({host:''127.0.0.1'', port:6060, path:''/readyz''}, res => process.exit(res.statusCode===200 ? 0 : 1)).on(''error'', () => process.exit(1));'\n      interval: 10s\n      timeout: 30s\n      retries: 15\n  penpot-exporter:\n    image: penpotapp/exporter:2.11.1\n    environment:\n      PENPOT_PUBLIC_URI: ${SERVICE_URL}\n      PENPOT_REDIS_URI: redis://penpot-valkey/0\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:6061/readyz\n      interval: 2s\n      timeout: 10s\n      retries: 15\n  minio:\n    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z\n\
  \    command: server /data\n    environment:\n      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}\n      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}\n    volumes:\n    - minio-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - mc\n      - ready\n      - local\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  minio-init:\n    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z\n    depends_on:\n      minio:\n        condition: service_healthy\n    entrypoint: \"sh -c \\\"\\n  mc alias set local http://minio:9000 ${SERVICE_USER_MINIO} ${SERVICE_PASSWORD_MINIO} &&\\n  mc mb -p local/penpot || true &&\\n  mc anonymous set private local/penpot\\n\\\"\\n\"\n    restart: 'no'\n  postgres:\n    image: postgres:15\n    volumes:\n    - penpot-postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_INITDB_ARGS: --data-checksums\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-penpot}\n\
  \    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $penpot\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  penpot-valkey:\n    image: valkey/valkey:8.1\n    volumes:\n    - penpot-valkey-data:/data\n    environment:\n      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - valkey-cli ping | grep PONG\n      interval: 1s\n      timeout: 3s\n      retries: 5\n      start_period: 3s\n  mailpit:\n    image: axllent/mailpit:v1.28\n    environment: {}\n    healthcheck:\n      test:\n      - CMD\n      - /mailpit\n      - readyz\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  minio-data: {}\n  penpot-postgresql-data: {}\n  penpot-valkey-data: {}\n"
