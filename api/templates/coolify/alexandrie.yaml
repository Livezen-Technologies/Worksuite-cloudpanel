# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: alexandrie
name: Alexandrie
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: A powerful Markdown workspace designed for speed, clarity, and creativity.
port: 8200
source: coolify
documentation: https://github.com/Smaug6739/Alexandrie/tree/main/docs
compose: "services:\n  frontend:\n    image: ghcr.io/smaug6739/alexandrie-frontend:v8.10.0\n    environment:\n      PORT: '8200'\n      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: ${CONFIG_DISABLE_SIGNUP:-false}\n      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: ${CONFIG_DISABLE_LANDING:-false}\n      NUXT_PUBLIC_BASE_API: ${SERVICE_URL}\n      NUXT_PUBLIC_BASE_CDN: ${SERVICE_URL}\n      NUXT_PUBLIC_CDN_ENDPOINT: ${CDN_ENDPOINT:-/alexandrie/}\n      NUXT_PUBLIC_BASE_URL: ${SERVICE_URL}\n    depends_on:\n    - backend\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8200'\n  backend:\n    image: ghcr.io/smaug6739/alexandrie-backend:v8.10.0\n    environment:\n      BACKEND_PORT: '8201'\n      GIN_MODE: release\n      JWT_SECRET: ${SERVICE_PASSWORD_JWT}\n      COOKIE_DOMAIN: ${SERVICE_URL}\n      FRONTEND_URL: ${SERVICE_URL}\n      ALLOW_UNSECURE: ${ALLOW_UNSECURE:-false}\n\
  \      DATABASE_HOST: mysql\n      DATABASE_PORT: '3306'\n      DATABASE_NAME: ${MYSQL_DATABASE:-alexandrie-db}\n      DATABASE_USER: ${SERVICE_USER_MYSQL}\n      DATABASE_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n      MINIO_ENDPOINT: rustfs:9000\n      MINIO_PUBLIC_URL: ${SERVICE_URL}\n      MINIO_SECURE: ${MINIO_SECURE:-false}\n      MINIO_ACCESSKEY: ${SERVICE_USER_RUSTFS}\n      MINIO_SECRETKEY: ${SERVICE_PASSWORD_RUSTFS}\n      MINIO_BUCKET: ${MINIO_BUCKET:-alexandrie}\n      SMTP_HOST: ${SMTP_HOST:-}\n      SMTP_MAIL: ${SMTP_MAIL:-}\n      SMTP_PASSWORD: ${SMTP_PASSWORD:-}\n    depends_on:\n      mysql:\n        condition: service_healthy\n      rustfs:\n        condition: service_healthy\n  mysql:\n    image: mysql:8.0\n    environment:\n      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}\n      MYSQL_USER: ${SERVICE_USER_MYSQL}\n      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n      MYSQL_DATABASE: ${MYSQL_DATABASE:-alexandrie-db}\n    volumes:\n    - mysql-data:/var/lib/mysql\n\
  \    healthcheck:\n      test:\n      - CMD\n      - mysqladmin\n      - ping\n      - -h\n      - localhost\n      - -u\n      - root\n      - -p${SERVICE_PASSWORD_MYSQLROOT}\n      timeout: 5s\n      interval: 10s\n      retries: 5\n  rustfs:\n    image: rustfs/rustfs:1.0.0-beta.8\n    environment:\n      RUSTFS_ACCESS_KEY: ${SERVICE_USER_RUSTFS}\n      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_RUSTFS}\n      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}\n      RUSTFS_LOG_LEVEL: ${RUSTFS_LOG_LEVEL:-info}\n    volumes:\n    - rustfs-data:/data\n    - rustfs-logs:/logs\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - nc -z localhost 9000 || exit 1\n      interval: 10s\n      timeout: 5s\n      retries: 5\nvolumes:\n  mysql-data: {}\n  rustfs-data: {}\n  rustfs-logs: {}\n"
