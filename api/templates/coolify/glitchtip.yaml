# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: glitchtip
name: Glitchtip
category: Monitoring
version: 1
type: compose
accent: '#6B16ED'
description: GlitchTip is a error tracking system.
port: 8000
source: coolify
documentation: https://glitchtip.com
compose: "services:\n  postgres:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRESQL_DATABASE:-glitchtip}\n    volumes:\n    - glitchtip-postgres-data:/var/lib/postgresql/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  redis:\n    image: redis\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - ping\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  web:\n    image: glitchtip/glitchtip:6.0\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    environment:\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRESQL}:${SERVICE_PASSWORD_POSTGRESQL}@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}\n      SECRET_KEY: ${SERVICE_BASE64_ENCRYPTION}\n\
  \      EMAIL_URL: ${EMAIL_URL:-consolemail://}\n      GLITCHTIP_DOMAIN: ${SERVICE_URL}\n      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-test@example.com}\n      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-1,3}\n      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}\n    volumes:\n    - uploads:/code/uploads\n    healthcheck:\n      test:\n      - CMD\n      - echo\n      - ok\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8000'\n  worker:\n    image: glitchtip/glitchtip:6.0\n    command: ./bin/run-celery-with-beat.sh\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    environment:\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRESQL}:${SERVICE_PASSWORD_POSTGRESQL}@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}\n\
  \      SECRET_KEY: ${SERVICE_BASE64_ENCRYPTION}\n      EMAIL_URL: ${EMAIL_URL:-consolemail://}\n      GLITCHTIP_DOMAIN: ${SERVICE_URL}\n      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-test@example.com}\n      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-1,3}\n      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}\n    volumes:\n    - uploads:/code/uploads\n    healthcheck:\n      test:\n      - CMD\n      - echo\n      - ok\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  migrate:\n    image: glitchtip/glitchtip:6.0\n    restart: 'no'\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    command: ./manage.py migrate\n    environment:\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRESQL}:${SERVICE_PASSWORD_POSTGRESQL}@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}\n      SECRET_KEY: ${SERVICE_BASE64_ENCRYPTION}\n      EMAIL_URL: ${EMAIL_URL:-consolemail://}\n  \
  \    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-test@example.com}\n      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-1,3}\n      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}\nvolumes:\n  glitchtip-postgres-data: {}\n  uploads: {}\n"
