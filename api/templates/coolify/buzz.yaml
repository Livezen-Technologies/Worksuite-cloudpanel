# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: buzz
name: Buzz
category: Messaging
version: 1
type: compose
accent: '#6B16ED'
description: Self-hostable workspace where humans and AI agents collaborate on a Nostr relay you own.
port: 3000
source: coolify
documentation: https://github.com/block/buzz
compose: "services:\n  buzz:\n    image: ghcr.io/block/buzz:${BUZZ_TAG:-main}\n    environment:\n      BUZZ_BIND_ADDR: 0.0.0.0:3000\n      BUZZ_HEALTH_PORT: '8080'\n      BUZZ_METRICS_PORT: '9102'\n      RELAY_URL: wss://${SERVICE_FQDN}\n      BUZZ_MEDIA_BASE_URL: ${SERVICE_URL}/media\n      BUZZ_MEDIA_SERVER_DOMAIN: ${SERVICE_FQDN}\n      BUZZ_CORS_ORIGINS: ${SERVICE_URL},tauri://localhost,http://tauri.localhost\n      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-buzz}\n      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379\n      BUZZ_S3_ENDPOINT: http://minio:9000\n      BUZZ_S3_ACCESS_KEY: ${SERVICE_USER_MINIO}\n      BUZZ_S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}\n      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}\n      BUZZ_GIT_REPO_PATH: /data/git\n      BUZZ_RELAY_PRIVATE_KEY: ${SERVICE_HEX_RELAYKEY}\n      BUZZ_GIT_HOOK_HMAC_SECRET: ${SERVICE_HEX_GITHMAC}\n      BUZZ_AUTO_MIGRATE: ${BUZZ_AUTO_MIGRATE:-true}\n\
  \      BUZZ_GIT_CONFORMANCE_PROBE: ${BUZZ_GIT_CONFORMANCE_PROBE:-true}\n      BUZZ_REQUIRE_AUTH_TOKEN: ${BUZZ_REQUIRE_AUTH_TOKEN:-true}\n      BUZZ_REQUIRE_RELAY_MEMBERSHIP: ${BUZZ_REQUIRE_RELAY_MEMBERSHIP:-false}\n      BUZZ_ALLOW_NIP_OA_AUTH: ${BUZZ_ALLOW_NIP_OA_AUTH:-true}\n      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}\n      RUST_LOG: ${RUST_LOG:-buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info}\n    volumes:\n    - buzz-git-data:/data/git\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n      minio:\n        condition: service_healthy\n      minio-init:\n        condition: service_completed_successfully\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - curl -fsS http://127.0.0.1:8080/_readiness >/dev/null || exit 1\n      interval: 10s\n      timeout: 5s\n      retries: 12\n      start_period: 45s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule:\
  \ Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  postgres:\n    image: postgres:17-alpine\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-buzz}\n      PGDATA: /var/lib/postgresql/data/pgdata\n    volumes:\n    - buzz-postgres-data:/var/lib/postgresql/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $buzz\n      interval: 5s\n      timeout: 5s\n      retries: 12\n      start_period: 10s\n  redis:\n    image: redis:7-alpine\n    command:\n    - redis-server\n    - --appendonly\n    - 'yes'\n    - --requirepass\n    - ${SERVICE_PASSWORD_REDIS}\n    environment:\n      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}\n    volumes:\n    - buzz-redis-data:/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG\n      interval: 5s\n\
  \      timeout: 3s\n      retries: 12\n      start_period: 5s\n  minio:\n    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z\n    command: server /data --console-address \":9001\"\n    environment:\n      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}\n      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}\n    volumes:\n    - buzz-minio-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - mc\n      - ready\n      - local\n      interval: 5s\n      timeout: 5s\n      retries: 12\n      start_period: 10s\n  minio-init:\n    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z\n    depends_on:\n      minio:\n        condition: service_healthy\n    environment:\n      BUZZ_S3_ACCESS_KEY: ${SERVICE_USER_MINIO}\n      BUZZ_S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}\n      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}\n    entrypoint:\n    - /bin/sh\n    - -euc\n    - 'mc alias set local http://minio:9000 \"$${BUZZ_S3_ACCESS_KEY}\" \"$${BUZZ_S3_SECRET_KEY}\"\n\n      mc mb --ignore-existing \"local/$buzz-media\"\
  \n\n      mc anonymous set none \"local/$buzz-media\"\n\n      '\n    restart: 'no'\nvolumes:\n  buzz-git-data: {}\n  buzz-postgres-data: {}\n  buzz-redis-data: {}\n  buzz-minio-data: {}\n"
