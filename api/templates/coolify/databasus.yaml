# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: databasus
name: Databasus
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: Databasus is a free, open source and self-hosted tool to backup PostgreSQL, MySQL, and MongoDB.
port: 4005
source: coolify
documentation: https://databasus.com/installation
compose: "services:\n  databasus:\n    image: databasus/databasus:v3.16.2\n    environment: {}\n    volumes:\n    - databasus-data:/databasus-data\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - -qO-\n      - http://localhost:4005/api/v1/system/health\n      interval: 5s\n      timeout: 10s\n      retries: 5\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '4005'\nvolumes:\n  databasus-data: {}\n"
