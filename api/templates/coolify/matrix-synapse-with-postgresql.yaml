# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: matrix-synapse-with-postgresql
name: Matrix Synapse With Postgresql
category: Messaging
version: 1
type: compose
accent: '#6B16ED'
description: Chat securely with your family, friends, community, or build great apps with Matrix!
port: 8008
source: coolify
documentation: https://element-hq.github.io/synapse/latest/welcome_and_overview.html
compose: "services:\n  synapse:\n    image: matrixdotorg/synapse:latest\n    environment:\n      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:?}\n      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS:-no}\n      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-false}\n      SERVICE_USER_ADMIN: ${SERVICE_USER_ADMIN}\n      SERVICE_PASSWORD_ADMIN: ${SERVICE_PASSWORD_ADMIN}\n      SERVICE_USER_POSTGRESQL: ${SERVICE_USER_POSTGRESQL}\n      SERVICE_PASSWORD_POSTGRESQL: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRES_DB:-synapse-db}\n    volumes:\n    - synapse-data:/data\n    entrypoint:\n    - /bin/bash\n    - -c\n    - \"! test -f /data/homeserver.yaml && /start.py generate\\n\\n# Extract secrets from generated config\\ngrep \\\"registration_shared_secret\\\" /data/homeserver.yaml \\\\\\n| awk '{print $2}' > ./registration_shared_secret\\n\\ngrep \\\"macaroon_secret_key\\\" /data/homeserver.yaml \\\\\\n| awk '{print $2}' > ./macaroon_secret_key\\n\\ngrep \\\"form_secret\\\" /data/homeserver.yaml\
  \ \\\\\\n| awk '{print $2}' > ./form_secret\\n\\n# Create homeserver.yaml with PostgreSQL\\ncat <<EOF > /data/homeserver.yaml\\nserver_name: \\\"${SYNAPSE_SERVER_NAME}\\\"\\npid_file: /data/homeserver.pid\\npublic_baseurl: \\\"${SERVICE_URL}/\\\"\\n\\nlisteners:\\n  - port: 8008\\n    tls: false\\n    type: http\\n    x_forwarded: true\\n    bind_addresses: ['0.0.0.0']\\n    resources:\\n      - names: [client, federation]\\n        compress: false\\n\\ndatabase:\\n  name: psycopg2\\n  args:\\n    user: ${SERVICE_USER_POSTGRESQL}\\n    password: ${SERVICE_PASSWORD_POSTGRESQL}\\n    database: ${POSTGRES_DB:-synapse-db}\\n    host: postgres\\n    port: 5432\\n    cp_min:\\\n      \\ 5\\n    cp_max: 10\\n\\nlog_config: \\\"/data/${SYNAPSE_SERVER_NAME}.log.config\\\"\\nmedia_store_path: /data/media_store\\nreport_stats: no\\n\\nregistration_shared_secret: $(<./registration_shared_secret)\\nmacaroon_secret_key: $(<./macaroon_secret_key)\\nform_secret: $(<./form_secret)\\nsigning_key_path: \\\
  \"/data/${SYNAPSE_SERVER_NAME}.signing.key\\\"\\n\\ntrusted_key_servers:\\n  - server_name: \\\"matrix.org\\\"\\nEOF\\n\\n[ \\\"false\\\" = \\\"true\\\" ] && ! grep \\\"#registration\\\" /data/homeserver.yaml &>/dev/null \\\\\\n&& echo >> /data/homeserver.yaml \\\\\\n&& cat <<EOF >> /data/homeserver.yaml\\nenable_registration: true\\nEOF\\n\\n# Register admin user if provided\\nregister_admin(){\\n  while ! curl -sf http://localhost:8008/health > /dev/null; do\\n    sleep 2\\n  done\\n  register_new_matrix_user \\\\\\n    -a \\\\\\n    -u ${SERVICE_USER_ADMIN} \\\\\\n    -p ${SERVICE_PASSWORD_ADMIN} \\\\\\n    -c /data/homeserver.yaml \\\\\\n    http://localhost:8008 &>/dev/null\\n}\\n[ -n \\\"${SERVICE_USER_ADMIN}\\\" ] && register_admin &\\n\\n/start.py\\n\"\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://localhost:8008/health\n      interval: 10s\n      timeout: 5s\n      retries: 10\n      start_period: 10s\n    depends_on:\n      postgres:\n \
  \       condition: service_healthy\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8008'\n  postgres:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRES_DB:-synapse-db}\n      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C\n    volumes:\n    - postgres-data:/var/lib/postgresql/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-synapse-db}\n      interval: 5s\n      timeout: 5s\n      retries: 10\nvolumes:\n  synapse-data: {}\n  postgres-data: {}\n"
