# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: n8n-with-postgres-and-worker
name: N8N With Postgres And Worker
category: Automation
version: 1
type: compose
accent: '#6B16ED'
description: n8n is an extendable workflow automation tool with queue mode and workers.
port: 5678
source: coolify
documentation: https://n8n.io
compose: "services:\n  n8n:\n    image: n8nio/n8n:2.10.4\n    environment:\n      N8N_EDITOR_BASE_URL: ${SERVICE_URL}\n      WEBHOOK_URL: ${SERVICE_URL}\n      N8N_HOST: ${SERVICE_URL}\n      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}\n      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}\n      TZ: ${TZ:-UTC}\n      DB_TYPE: postgresdb\n      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}\n      DB_POSTGRESDB_HOST: postgresql\n      DB_POSTGRESDB_PORT: '5432'\n      DB_POSTGRESDB_USER: ${SERVICE_USER_POSTGRES}\n      DB_POSTGRESDB_SCHEMA: public\n      DB_POSTGRESDB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      EXECUTIONS_MODE: queue\n      QUEUE_BULL_REDIS_HOST: redis\n      QUEUE_HEALTH_CHECK_ACTIVE: 'true'\n      N8N_ENCRYPTION_KEY: ${SERVICE_PASSWORD_ENCRYPTION}\n      N8N_RUNNERS_ENABLED: 'true'\n      N8N_RUNNERS_MODE: external\n      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: ${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}\n      N8N_RUNNERS_BROKER_PORT: ${N8N_RUNNERS_BROKER_PORT:-5679}\n      N8N_RUNNERS_AUTH_TOKEN:\
  \ ${SERVICE_PASSWORD_N8N}\n      N8N_NATIVE_PYTHON_RUNNER: ${N8N_NATIVE_PYTHON_RUNNER:-true}\n      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-5}\n      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: 'true'\n      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}\n      N8N_GIT_NODE_DISABLE_BARE_REPOS: ${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}\n      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}\n      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}\n      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: ${N8N_SKIP_AUTH_ON_OAUTH_CALLBACK:-false}\n    volumes:\n    - n8n-data:/home/node/.n8n\n    depends_on:\n      postgresql:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - wget -qO- http://127.0.0.1:5678/healthz\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule:\
  \ Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '5678'\n  n8n-worker:\n    image: n8nio/n8n:2.10.4\n    command: worker\n    environment:\n      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}\n      TZ: ${TZ:-UTC}\n      DB_TYPE: postgresdb\n      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}\n      DB_POSTGRESDB_HOST: postgresql\n      DB_POSTGRESDB_PORT: '5432'\n      DB_POSTGRESDB_USER: ${SERVICE_USER_POSTGRES}\n      DB_POSTGRESDB_SCHEMA: public\n      DB_POSTGRESDB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      EXECUTIONS_MODE: queue\n      QUEUE_BULL_REDIS_HOST: redis\n      QUEUE_HEALTH_CHECK_ACTIVE: 'true'\n      N8N_ENCRYPTION_KEY: ${SERVICE_PASSWORD_ENCRYPTION}\n      N8N_RUNNERS_ENABLED: 'true'\n      N8N_RUNNERS_MODE: external\n      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: ${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}\n      N8N_RUNNERS_BROKER_PORT: ${N8N_RUNNERS_BROKER_PORT:-5679}\n      N8N_RUNNERS_AUTH_TOKEN: ${SERVICE_PASSWORD_N8N}\n      N8N_NATIVE_PYTHON_RUNNER:\
  \ ${N8N_NATIVE_PYTHON_RUNNER:-true}\n      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-5}\n      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}\n      N8N_GIT_NODE_DISABLE_BARE_REPOS: ${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}\n      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}\n      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}\n      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: ${N8N_SKIP_AUTH_ON_OAUTH_CALLBACK:-false}\n    volumes:\n    - n8n-data:/home/node/.n8n\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - wget -qO- http://127.0.0.1:5678/healthz\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    depends_on:\n      n8n:\n        condition: service_healthy\n      postgresql:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n  postgresql:\n    image: postgres:16-alpine\n    volumes:\n    - postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER:\
  \ ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-n8n}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $n8n\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  redis:\n    image: redis:6-alpine\n    volumes:\n    - redis-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - ping\n      interval: 5s\n      timeout: 5s\n      retries: 10\n  task-runners:\n    image: n8nio/runners:2.10.4\n    environment:\n      N8N_RUNNERS_TASK_BROKER_URI: ${N8N_RUNNERS_TASK_BROKER_URI:-http://n8n-worker:5679}\n      N8N_RUNNERS_AUTH_TOKEN: ${SERVICE_PASSWORD_N8N}\n      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: ${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-15}\n      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-5}\n    depends_on:\n    - n8n\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - wget -qO- http://127.0.0.1:5680/healthz\n      interval:\
  \ 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  n8n-data: {}\n  postgresql-data: {}\n  redis-data: {}\n"
