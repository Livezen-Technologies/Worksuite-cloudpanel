# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: bugsink
name: Bugsink
category: Monitoring
version: 1
type: compose
accent: '#6B16ED'
description: Self-hosted Error Tracking.
port: 8000
source: coolify
documentation: https://www.bugsink.com/docs/
compose: "services:\n  mysql:\n    image: mysql:latest\n    restart: unless-stopped\n    environment:\n      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}\n      MYSQL_DATABASE: ${MYSQL_DATABASE:-bugsink}\n      MYSQL_USER: ${SERVICE_USER_MYSQL}\n      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}\n    volumes:\n    - my-datavolume:/var/lib/mysql\n    healthcheck:\n      test:\n      - CMD\n      - mysqladmin\n      - ping\n      - -h\n      - 127.0.0.1\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  web:\n    image: bugsink/bugsink\n    restart: unless-stopped\n    environment:\n      SECRET_KEY: ${SERVICE_PASSWORD_BUGSINK}\n      CREATE_SUPERUSER: ${BUGSINK_ADMIN_EMAIL:?}:${SERVICE_PASSWORD_BUGSINK}\n      BASE_URL: ${SERVICE_URL}\n      DATABASE_URL: mysql://${SERVICE_USER_MYSQL}:${SERVICE_PASSWORD_MYSQL}@mysql:3306/${MYSQL_DATABASE:-bugsink}\n      BEHIND_HTTPS_PROXY: 'True'\n      SITE_TITLE: ${SITE_TITLE:-Bugsink}\n      TIME_ZONE: ${TIME_ZONE:-UTC}\n      PHONEHOME:\
  \ ${PHONEHOME:-False}\n      EMAIL_HOST: ${EMAIL_HOST}\n      EMAIL_PORT: ${EMAIL_PORT:-587}\n      EMAIL_HOST_USER: ${EMAIL_HOST_USER}\n      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}\n      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}\n      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}\n      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - python -c 'import requests; requests.get(\"http://localhost:8000/\").raise_for_status()'\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    depends_on:\n      mysql:\n        condition: service_healthy\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8000'\nvolumes:\n  my-datavolume: {}\n"
