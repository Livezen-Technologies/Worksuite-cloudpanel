# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: bluesky-pds
name: Bluesky Pds
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: Bluesky PDS (Personal Data Server)
port: 3000
source: coolify
documentation: https://github.com/bluesky-social/pds
compose: "services:\n  pds:\n    image: ghcr.io/bluesky-social/pds:0.4.182\n    volumes:\n    - pds-data:/pds\n    environment:\n      PDS_HOSTNAME: ${SERVICE_FQDN}\n      PDS_JWT_SECRET: ${SERVICE_HEX_JWTSECRET}\n      PDS_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}\n      PDS_ADMIN_EMAIL: ${PDS_ADMIN_EMAIL}\n      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${SERVICE_HEX_ROTATIONKEY}\n      PDS_DATA_DIRECTORY: ${PDS_DATA_DIRECTORY:-/pds}\n      PDS_BLOBSTORE_DISK_LOCATION: ${PDS_DATA_DIRECTORY:-/pds}/blocks\n      PDS_BLOB_UPLOAD_LIMIT: ${PDS_BLOB_UPLOAD_LIMIT:-104857600}\n      PDS_DID_PLC_URL: ${PDS_DID_PLC_URL:-https://plc.directory}\n      PDS_EMAIL_FROM_ADDRESS: ${PDS_EMAIL_FROM_ADDRESS}\n      PDS_EMAIL_SMTP_URL: ${PDS_EMAIL_SMTP_URL}\n      PDS_BSKY_APP_VIEW_URL: ${PDS_BSKY_APP_VIEW_URL:-https://api.bsky.app}\n      PDS_BSKY_APP_VIEW_DID: ${PDS_BSKY_APP_VIEW_DID:-did:web:api.bsky.app}\n      PDS_REPORT_SERVICE_URL: ${PDS_REPORT_SERVICE_URL:-https://mod.bsky.app/xrpc/com.atproto.moderation.createReport}\n\
  \      PDS_REPORT_SERVICE_DID: ${PDS_REPORT_SERVICE_DID:-did:plc:ar7c4by46qjdydhdevvrndac}\n      PDS_CRAWLERS: ${PDS_CRAWLERS:-https://bsky.network}\n      LOG_ENABLED: ${LOG_ENABLED:-true}\n    command: \"sh -c '\\n  set -euo pipefail\\n  echo \\\"Installing required packages and pdsadmin...\\\"\\n  apk add --no-cache openssl curl bash jq coreutils gnupg util-linux-misc >/dev/null\\n  curl -o /usr/local/bin/pdsadmin.sh https://raw.githubusercontent.com/bluesky-social/pds/main/pdsadmin.sh\\n  chmod 700 /usr/local/bin/pdsadmin.sh\\n  ln -sf /usr/local/bin/pdsadmin.sh /usr/local/bin/pdsadmin\\n  echo \\\"Creating an empty pds.env file so pdsadmin works...\\\"\\n  touch /pds/pds.env\\n  echo \\\"Launching PDS, enjoy!...\\\"\\n  exec node --enable-source-maps index.js\\n'\\n\"\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - --spider\n      - http://127.0.0.1:3000/xrpc/_health\n      interval: 5s\n      timeout: 10s\n      retries: 10\n    labels:\n      traefik.enable:\
  \ 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\nvolumes:\n  pds-data: {}\n"
