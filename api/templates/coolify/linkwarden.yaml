# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: linkwarden
name: Linkwarden
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: A self-hostable collaborative bookmark manager to collect, organize, and preserve web pages.
port: 3000
source: coolify
documentation: https://docs.linkwarden.app/self-hosting/setup
compose: "services:\n  linkwarden:\n    image: ghcr.io/linkwarden/linkwarden:v2.16.1\n    environment:\n      NEXTAUTH_URL: ${SERVICE_URL}/api/v1/auth\n      NEXTAUTH_SECRET: ${SERVICE_PASSWORD_LINKWARDENNEXTAUTH}\n      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_MEILI}\n      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-linkwarden}\n    volumes:\n    - linkwarden-data:/data/data\n    depends_on:\n      postgresql:\n        condition: service_healthy\n      meilisearch:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:3000\n      interval: 10s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  postgresql:\n    image: postgres:16-alpine\n    volumes:\n    - postgresql-data:/var/lib/postgresql/data\n\
  \    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-linkwarden}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $linkwarden\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  meilisearch:\n    image: getmeili/meilisearch:v1.12.8\n    environment:\n      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_MEILI}\n    volumes:\n    - meilisearch-data:/meili_data\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:7700/health\n      interval: 5s\n      timeout: 10s\n      retries: 10\nvolumes:\n  linkwarden-data: {}\n  postgresql-data: {}\n  meilisearch-data: {}\n"
