# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: linkding-plus
name: Linkding Plus
category: Personal
version: 1
type: compose
accent: '#6B16ED'
description: A self-hosted bookmark manager designed to be minimal, fast, and easy to set up. (Includes feature for archiving websites as HTML snapshots)
port: 9090
source: coolify
documentation: https://linkding.link/
compose: "services:\n  linkding-plus:\n    image: sissbruecker/linkding:latest-plus\n    volumes:\n    - linkding_data:/etc/linkding/data\n    environment:\n      LD_SUPERUSER_NAME: ${SERVICE_USER_LINKDING}\n      LD_SUPERUSER_PASSWORD: ${SERVICE_PASSWORD_LINKDING}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - bash -c ':> /dev/tcp/127.0.0.1/9090' || exit 1\n      interval: 5s\n      timeout: 5s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '9090'\nvolumes:\n  linkding_data: {}\n"
