# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: prowlarr
name: Prowlarr
category: Media
version: 1
type: compose
accent: '#6B16ED'
description: Prowlarr⁠ is a indexer manager/proxy built on the popular arr .net/reactjs base stack to integrate with your various PVR apps.
port: 9696
source: coolify
documentation: https://hub.docker.com/r/linuxserver/prowlarr
compose: "services:\n  prowlarr:\n    image: lscr.io/linuxserver/prowlarr:latest\n    environment:\n      _APP_URL: ${SERVICE_URL}\n      PUID: '1000'\n      PGID: '1000'\n      TZ: ${TZ:-America/Toronto}\n    volumes:\n    - prowlarr-config:/config\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://localhost:9696/ping\n      interval: 2s\n      timeout: 10s\n      retries: 15\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '9696'\nvolumes:\n  prowlarr-config: {}\n"
