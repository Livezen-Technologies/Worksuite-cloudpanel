# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: pocket-id
name: Pocket Id
category: Security
version: 1
type: compose
accent: '#6B16ED'
description: A simple and secure OIDC provider with passkey authentication
port: 1411
source: coolify
documentation: https://pocket-id.org/docs/setup/installation
compose: "services:\n  pocket-id:\n    image: ghcr.io/pocket-id/pocket-id:v1.13\n    environment:\n      APP_URL: ${SERVICE_URL}\n      TRUST_PROXY: ${TRUST_PROXY:-true}\n      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}\n      SMTP_HOST: ${SMTP_HOST}\n      SMTP_PORT: ${SMTP_PORT:-587}\n      SMTP_FROM: ${SMTP_FROM}\n      SMTP_USER: ${SMTP_USER}\n      SMTP_PASSWORD: ${SMTP_PASSWORD}\n      SMTP_TLS: ${SMTP_TLS:-starttls}\n      SMTP_SKIP_CERT_VERIFY: ${SMTP_SKIP_CERT_VERIFY:-false}\n      EMAIL_LOGIN_NOTIFICATION_ENABLED: ${EMAIL_LOGIN_NOTIFICATION_ENABLED:-false}\n      EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: ${EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED:-false}\n      EMAIL_API_KEY_EXPIRATION_ENABLED: ${EMAIL_API_KEY_EXPIRATION_ENABLED:-false}\n      PUID: ${PUID:-1000}\n      PGID: ${PGID:-1000}\n    volumes:\n    - pocket-id-data:/app/data\n    healthcheck:\n      test:\n      - CMD\n      - /app/pocket-id\n      - healthcheck\n      interval: 30s\n      timeout: 5s\n      retries: 3\n\
  \      start_period: 10s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '1411'\nvolumes:\n  pocket-id-data: {}\n"
