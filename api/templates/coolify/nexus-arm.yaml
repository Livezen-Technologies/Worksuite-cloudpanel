# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: nexus-arm
name: Nexus Arm
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: 'Open source Universal Repository Manager (ARM version, community edition), default credentials: admin/admin123'
port: 8081
source: coolify
documentation: https://help.sonatype.com/en/sonatype-nexus-repository.html
compose: "services:\n  nexus:\n    image: sonatypecommunity/nexus3\n    environment:\n      NEXUS_SECURITY_RANDOMPASSWORD: 'false'\n      INSTALL4J_ADD_VM_PARAMS: -Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs\n    volumes:\n    - nexus_data:/nexus-data\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://localhost:8081/service/rest/v1/status\n      interval: 10s\n      timeout: 10s\n      retries: 3\n      start_period: 60s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8081'\nvolumes:\n  nexus_data: {}\n"
