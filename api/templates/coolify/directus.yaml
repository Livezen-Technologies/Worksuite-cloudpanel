# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: directus
name: Directus
category: CMS
version: 1
type: compose
accent: '#6B16ED'
description: Directus wraps databases with a dynamic API, and provides an intuitive app for managing its content.
port: 8055
source: coolify
documentation: https://directus.io
compose: "services:\n  directus:\n    image: directus/directus:11\n    volumes:\n    - directus-database:/directus/database\n    - directus-uploads:/directus/uploads\n    - directus-extensions:/directus/extensions\n    - directus-templates:/directus/templates\n    environment:\n      KEY: ${SERVICE_BASE64_KEY}\n      SECRET: ${SERVICE_BASE64_SECRET}\n      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}\n      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}\n      DB_CLIENT: sqlite3\n      DB_FILENAME: /directus/database/data.db\n      WEBSOCKETS_ENABLED: 'true'\n      CORS_ENABLED: ${CORS_ENABLED:-true}\n      CORS_ORIGIN: ${CORS_ORIGIN}\n      CORS_METHODS: ${CORS_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}\n      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}\n      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - -q\n      - --spider\n      - http://127.0.0.1:8055/admin/login\n      interval: 5s\n      timeout:\
  \ 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8055'\nvolumes:\n  directus-database: {}\n  directus-uploads: {}\n  directus-extensions: {}\n  directus-templates: {}\n"
