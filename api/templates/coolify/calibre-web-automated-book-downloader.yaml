# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: calibre-web-automated-book-downloader
name: Calibre Web Automated Book Downloader
category: Media
version: 1
type: compose
accent: '#6B16ED'
description: An intuitive web interface for searching and requesting book downloads, designed to work seamlessly with Calibre-Web-Automated.
port: 8083
source: coolify
documentation: https://github.com/calibrain/calibre-web-automated-book-downloader
compose: "services:\n  calibre-web-automated:\n    image: crocodilestick/calibre-web-automated:latest\n    environment:\n      PUID: ${PUID:-1000}\n      PGID: ${PGID:-1000}\n      TZ: ${TZ:-UTC}\n      NETWORK_SHARE_MODE: ${NETWORK_SHARE_MODE:-false}\n    volumes:\n    - cwa-config:/config\n    - cwa-book-ingest:/cwa-book-ingest\n    - calibre-library:/calibre-library\n    - calibre-plugins:/config/.config/calibre/plugins\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - curl -fs http://localhost:8083 || exit 1\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 30s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8083'\n  calibre-web-downloader:\n    image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest\n    environment:\n      FLASK_PORT: ${FLASK_PORT:-8084}\n      LOG_LEVEL: ${LOG_LEVEL:-info}\n      BOOK_LANGUAGE:\
  \ ${BOOK_LANGUAGE:-en}\n      USE_BOOK_TITLE: ${USE_BOOK_TITLE:-true}\n      TZ: ${TZ:-America/New_York}\n      APP_ENV: ${APP_ENV:-prod}\n      UID: ${UID:-1000}\n      GID: ${GID:-100}\n      CWA_DB_PATH: ${CWA_DB_PATH:-/cwa-config/app.db}\n    volumes:\n    - cwa-book-ingest:/cwa-book-ingest\n    - cwa-config:/cwa-config\nvolumes:\n  cwa-config: {}\n  cwa-book-ingest: {}\n  calibre-library: {}\n  calibre-plugins: {}\n"
