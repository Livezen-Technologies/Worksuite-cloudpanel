# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: sure
name: Sure
category: Business
version: 1
type: compose
accent: '#6B16ED'
description: An all-in-one personal finance platform.
port: 3000
source: coolify
documentation: https://github.com/we-promise/sure
compose: "services:\n  web:\n    image: ghcr.io/we-promise/sure:0.6.7\n    environment:\n      APP_DOMAIN: ${SERVICE_FQDN}\n      SECRET_KEY_BASE: ${SERVICE_BASE64_BASE}\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRESQL_DATABASE:-sure}\n      REDIS_URL: redis://valkey:6379\n      DB_HOST: postgresql\n      DB_PORT: '5432'\n      SELF_HOSTED: 'true'\n      RAILS_FORCE_SSL: 'false'\n      RAILS_ASSUME_SSL: 'false'\n      ONBOARDING_STATE: ${ONBOARDING_STATE:-open}\n    depends_on:\n      postgresql:\n        condition: service_healthy\n      valkey:\n        condition: service_healthy\n    volumes:\n    - sure-app-storage:/rails/storage\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - -f\n      - http://127.0.0.1:3000\n      interval: 15s\n      timeout: 20s\n      retries: 5\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n\
  \      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  worker:\n    image: ghcr.io/we-promise/sure:0.6.7\n    command: bundle exec sidekiq\n    environment:\n      APP_DOMAIN: ${SERVICE_FQDN}\n      SECRET_KEY_BASE: ${SERVICE_BASE64_BASE}\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRESQL_DATABASE:-sure}\n      REDIS_URL: redis://valkey:6379\n      DB_HOST: postgresql\n      DB_PORT: '5432'\n      SELF_HOSTED: 'true'\n      RAILS_FORCE_SSL: 'false'\n      RAILS_ASSUME_SSL: 'false'\n      ONBOARDING_STATE: ${ONBOARDING_STATE:-open}\n    volumes:\n    - sure-app-storage:/rails/storage\n    depends_on:\n      postgresql:\n        condition: service_healthy\n      valkey:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - pgrep\n      - -f\n      - sidekiq\n      interval: 15s\n      timeout: 20s\n      retries: 5\n  postgresql:\n    image: postgres:16-alpine\n\
  \    volumes:\n    - sure-postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}\n      POSTGRES_DB: ${POSTGRESQL_DATABASE:-sure}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  valkey:\n    image: valkey/valkey:8-alpine\n    command: valkey-server --appendonly yes\n    volumes:\n    - sure-valkey:/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - valkey-cli ping | grep PONG\n      interval: 5s\n      timeout: 5s\n      retries: 5\n      start_period: 3s\nvolumes:\n  sure-app-storage: {}\n  sure-postgresql-data: {}\n  sure-valkey: {}\n"
