# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: docuseal-with-postgres
name: Docuseal With Postgres
category: Productivity
version: 1
type: compose
accent: '#6B16ED'
description: Document Signing for Everyone free forever for individuals, extensible for businesses and developers. Open Source Alternative to DocuSign, PandaDoc and more.
port: 3000
source: coolify
documentation: https://www.docuseal.co/
compose: "services:\n  docuseal:\n    image: docuseal/docuseal:latest\n    environment:\n      HOST: ${SERVICE_URL}\n      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/docuseal\n    volumes:\n    - docuseal-data:/data\n    depends_on:\n      postgresql:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - wget\n      - -q\n      - --spider\n      - http://127.0.0.1:3000\n      interval: 5s\n      timeout: 20s\n      retries: 10\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  postgresql:\n    image: postgres:16-alpine\n    volumes:\n    - postgresql-data:/var/lib/postgresql/data\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-docuseal}\n    healthcheck:\n      test:\n\
  \      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $docuseal\n      interval: 5s\n      timeout: 20s\n      retries: 10\nvolumes:\n  docuseal-data: {}\n  postgresql-data: {}\n"
