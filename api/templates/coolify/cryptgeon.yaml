# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: cryptgeon
name: Cryptgeon
category: Security
version: 1
type: compose
accent: '#6B16ED'
description: Secure note / file sharing service inspired by PrivNote.
port: 8000
source: coolify
documentation: https://github.com/cupcakearmy/cryptgeon
compose: "services:\n  app:\n    image: cupcakearmy/cryptgeon:latest\n    environment:\n      SIZE_LIMIT: ${SIZE_LIMIT:-4 MiB}\n      MAX_VIEWS: ${MAX_VIEWS:-100}\n      MAX_EXPIRATION: ${MAX_EXPIRATION:-360}\n      ALLOW_ADVANCED: ${ALLOW_ADVANCED:-true}\n      ALLOW_FILES: ${ALLOW_FILES:-true}\n    depends_on:\n      redis:\n        condition: service_healthy\n    healthcheck:\n      test:\n      - CMD\n      - curl\n      - --fail\n      - http://127.0.0.1:8000/api/live/\n      interval: 1m\n      timeout: 3s\n      retries: 2\n      start_period: 5s\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8000'\n  redis:\n    image: redis:7-alpine\n    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - PING\n      interval: 5s\n      timeout: 10s\n      retries: 2\n"
