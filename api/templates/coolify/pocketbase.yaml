compose: "services:\n  pocketbase:\n    image: ghcr.io/coollabsio/pocketbase:latest\n    environment: {}\n    volumes:\n    - pocketbase-data:/app/pb_data\n    - pocketbase-hooks:/app/pb_hooks\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '8080'\nvolumes:\n  pocketbase-data: {}\n  pocketbase-hooks: {}\n"
