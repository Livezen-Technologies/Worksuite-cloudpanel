# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: newapi
name: Newapi
category: Development
version: 1
type: compose
accent: '#6B16ED'
description: The next-generation LLM gateway and AI asset management system supports multiple languages.
port: 3000
source: coolify
documentation: https://docs.newapi.pro/en/getting-started/
compose: "services:\n  new-api:\n    image: calciumion/new-api:v0.9.2.0\n    depends_on:\n      postgresql:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    environment:\n      SQL_DSN: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DATABASE:-newapi}?sslmode=disable&TimeZone=${TZ:-Asia/Shanghai}\n      REDIS_CONN_STRING: redis://redis:6379\n      TZ: ${TZ:-Asia/Shanghai}\n      SESSION_SECRET: ${SERVICE_BASE64_SESSION_SECRET}\n      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - 'wget -q -O - http://localhost:3000/api/status | grep -o ''\"success\":\\s*true'' | awk -F: ''{print $2}'''\n      interval: 30s\n      timeout: 10s\n      retries: 3\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  postgresql:\n    image:\
  \ postgres:16-alpine\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DATABASE:-newapi}\n    volumes:\n    - postgresql-data:/var/lib/postgresql/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-newapi}\n      interval: 5s\n      timeout: 10s\n      retries: 20\n  redis:\n    image: redis:7-alpine\n    volumes:\n    - redis-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - PING\n      interval: 5s\n      timeout: 10s\n      retries: 20\nvolumes:\n  postgresql-data: {}\n  redis-data: {}\n"
