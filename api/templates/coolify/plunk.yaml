# Imported from Coolify (Apache-2.0): https://github.com/coollabsio/coolify/tree/main/templates/compose
id: plunk
name: Plunk
category: Messaging
version: 1
type: compose
accent: '#6B16ED'
description: Plunk, The Open-Source Email Platform for AWS
port: 3000
source: coolify
documentation: https://docs.useplunk.com/getting-started/introduction
compose: "services:\n  plunk:\n    image: driaug/plunk:latest\n    depends_on:\n      postgresql:\n        condition: service_healthy\n      redis:\n        condition: service_started\n    environment:\n      REDIS_URL: redis://redis:6379\n      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql/plunk-db?schema=public\n      JWT_SECRET: ${SERVICE_PASSWORD_JWTSECRET}\n      AWS_REGION: ${AWS_REGION:?}\n      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}\n      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}\n      AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:?}\n      NEXT_PUBLIC_API_URI: ${SERVICE_URL}/api\n      APP_URI: ${SERVICE_URL}\n      API_URI: ${SERVICE_URL}/api\n      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-False}\n      NODE_OPTIONS: --no-network-family-autoselection\n    entrypoint:\n    - /app/entry.sh\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - (wget -S --spider http://127.0.0.1:3000/api/health 2>&1 | grep -q \"HTTP/1.1\
  \ [1-3]\")\n      interval: 2s\n      timeout: 10s\n      retries: 15\n    labels:\n      traefik.enable: 'true'\n      traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)\n      traefik.http.services.${STACK}.loadbalancer.server.port: '3000'\n  postgresql:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_USER: ${SERVICE_USER_POSTGRES}\n      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}\n      POSTGRES_DB: ${POSTGRES_DB:-plunk-db}\n    volumes:\n    - plunk-postgresql-data:/var/lib/postgresql/data\n    healthcheck:\n      test:\n      - CMD-SHELL\n      - pg_isready -U $${POSTGRES_USER} -d $plunk-db\n      interval: 5s\n      timeout: 20s\n      retries: 10\n  redis:\n    image: redis:7.4-alpine\n    volumes:\n    - plunk-redis-data:/data\n    healthcheck:\n      test:\n      - CMD\n      - redis-cli\n      - PING\n      interval: 5s\n      timeout: 10s\n      retries: 20\nvolumes:\n  plunk-postgresql-data: {}\n  plunk-redis-data: {}\n"
