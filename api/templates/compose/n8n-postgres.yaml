id: n8n-postgres
name: n8n + PostgreSQL
category: Automation
version: 1
type: compose
accent: "#EA4B71"
description: n8n with PostgreSQL for production workflows.
port: 5678
compose: |
  services:
    n8n:
      image: n8nio/n8n:1
      restart: unless-stopped
      depends_on: [db]
      environment:
        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: db
        DB_POSTGRESDB_DATABASE: n8n
        DB_POSTGRESDB_USER: ${SERVICE_USER_N8N}
        DB_POSTGRESDB_PASSWORD: ${SERVICE_PASSWORD_N8N}
        N8N_ENCRYPTION_KEY: ${SERVICE_HEX_N8N}
        N8N_HOST: ${SERVICE_FQDN}
        WEBHOOK_URL: ${SERVICE_URL}/
      volumes: [data:/home/node/.n8n]
      labels:
        traefik.enable: "true"
        traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)
        traefik.http.services.${STACK}.loadbalancer.server.port: "5678"
    db:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_DB: n8n
        POSTGRES_USER: ${SERVICE_USER_N8N}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_N8N}
      volumes: [db:/var/lib/postgresql/data]
  volumes:
    data: {}
    db: {}
