id: nextcloud-postgres
name: Nextcloud + PostgreSQL + Redis
category: Productivity
version: 1
type: compose
accent: "#0082C9"
description: Nextcloud with PostgreSQL and a Redis cache.
port: 80
compose: |
  services:
    app:
      image: nextcloud:30-apache
      restart: unless-stopped
      depends_on: [db, redis]
      environment:
        POSTGRES_HOST: db
        POSTGRES_DB: nextcloud
        POSTGRES_USER: ${SERVICE_USER_NC}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_NC}
        REDIS_HOST: redis
        NEXTCLOUD_ADMIN_USER: admin
        NEXTCLOUD_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
        NEXTCLOUD_TRUSTED_DOMAINS: ${SERVICE_FQDN}
      volumes: [html:/var/www/html]
      labels:
        traefik.enable: "true"
        traefik.http.routers.${STACK}.rule: Host(`${SERVICE_FQDN}`)
        traefik.http.services.${STACK}.loadbalancer.server.port: "80"
    db:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_DB: nextcloud
        POSTGRES_USER: ${SERVICE_USER_NC}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_NC}
      volumes: [db:/var/lib/postgresql/data]
    redis:
      image: redis:7-alpine
      restart: unless-stopped
  volumes:
    html: {}
    db: {}
