name: CI

# Runs on every pull request and on pushes to main. The three parts of the
# panel are checked independently, so one red job names the part that broke.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build both architectures
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/agent

  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, intl, zip, gd, bcmath, sodium
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Environment
        run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/phpunit

  api-pgsql:
    # Production runs PostgreSQL; SQLite accepts things PostgreSQL rejects (unknown columns as strings,
    # '' compared with uuid, column names of aggregates), so the suite also runs here.
    name: API (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, zip, gd, bcmath, sodium
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Environment
        run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/phpunit -c phpunit.pgsql.xml

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - run: npm test

  # Security audit, phase 15 (docs/security-audit.md): secrets, dependencies and static analysis on every PR.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the whole history
      - name: Secret scan (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP dependencies (composer audit)
        working-directory: api
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web dependencies (npm audit, shipped code)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: agent/go.sum
      - name: Go vulnerabilities (govulncheck)
        working-directory: agent
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Static analysis (Semgrep, local rules; blocking)
        run: |
          pipx install semgrep==1.183.0
          semgrep scan --error --metrics=off --config .semgrep/rules.yml --exclude '*_test.go' api/app api/routes api/resources agent/internal agent/cmd web/src
      - name: Static analysis (Semgrep OWASP Top 10 registry rules; report-only until triaged)
        continue-on-error: true
        run: semgrep scan --metrics=off --config p/owasp-top-ten api/app api/routes api/resources agent/internal agent/cmd web/src
